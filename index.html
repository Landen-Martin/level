<script type="module">
import * as THREE from 'three';

const CS = 3.0;
const WH = 3.0;
const CHUNK = 24;
const EYE_Y = 0.55;
const ROVER_R = 0.35;
const TURN_SPEED = 2.4;
const MOVE_SPEED = 2.2;
const BACK_SPEED = 1.4;
const NOCLIP_TIME = 0.9;
const RES = 360;

const SPAWN_GX = 1, SPAWN_GZ = 1;

const MONSTER_BACTERIA = 0;
const MONSTER_SMILER = 1;
const BACTERIA_COUNT = 14;
const SMILER_COUNT = 8;
const MONSTER_MIN_SPAWN_DIST = 14;

const BACTERIA_SPEED = 0.85;
const BACTERIA_CHASE_SPEED = 2.60;
const BACTERIA_HEAR_BASE = 5.5;
const BACTERIA_HEAR_BONUS = 30.0;

const SMILER_SPEED = 0.70;
const SMILER_CHASE_SPEED = 3.10;
const SMILER_LIGHT_RANGE = 18.0;
const SMILER_CLOSE_RANGE = 3.6;

const SONAR_RANGE = 16;
const SONAR_RAYS = 96;
const SONAR_ARC = Math.PI * 2;
const SONAR_WAVE_SPEED = 9.0;

const MONSTER_GLITCH_RANGE = 12.0;
const WALL_GLITCH_RANGE = 10.0;

const EXIT_COUNT = 80;
const ROOM_SECTOR = 40;

const WORLD_SECTORS = 5;
const SECTOR_TILES = 48;
const WORLD_HALF = (WORLD_SECTORS * SECTOR_TILES) / 2;

const CAUGHT_DIST = 1.55;
const GRACE_AFTER_LOAD = 2.5;

/* Ceiling luminaires: visual mesh on every lit tile.
   Real light sources are sparser (every 2nd tile) — invisible to the eye
   but drops the light count ~4x. The nearest few become shadow-casters. */
const FIXTURE_EVERY = 1;
const LIGHT_STRIDE = 2;
const MAX_ACTIVE_LAMPS = 14;
const MAX_SHADOW_LAMPS = 2;
const LAMP_RANGE = 12;
const LAMP_INTENSITY = 7.5;
const LAMP_HEIGHT = WH - 0.30;
const MAX_LAMP_D2 = 22 * 22;

const SAVE_KEY = 'rover_level0_save_v17';
const SAVE_INTERVAL_MS = 1000;

let savedGame = null;
try { savedGame = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch(e){}
if (savedGame && (typeof savedGame.seed !== 'number' || savedGame.version !== 17)) savedGame = null;

const WORLD_SEED = (savedGame?.seed ?? (Math.random() * 0xFFFFFFF)) >>> 0;

function hash2(x, y){
  let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + WORLD_SEED) | 0;
  n = (n ^ (n >>> 13)) | 0;
  n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function n2(x, y){ return hash2(x * 8123 + 17, y * 9187 + 43); }

const roomCache = new Map();
function pickRoomDim(h){
  const t = h * 100;
  if (t < 40) return 3;
  if (t < 66) return 4;
  if (t < 83) return 5;
  if (t < 94) return 6;
  return 7;
}
function getRoomsInSector(sx, sz){
  const key = sx + ',' + sz;
  const cached = roomCache.get(key);
  if (cached) return cached;

  const rooms = [];
  const count = 1 + Math.floor(hash2(sx * 733 + 11, sz * 911 + 29) * 3);
  for (let i = 0; i < count; i++){
    const w = pickRoomDim(hash2(sx * 131 + i * 977 + 3, sz * 577 + 7));
    const h = pickRoomDim(hash2(sx * 313 + i * 541 + 13, sz * 811 + 17));
    const hx = hash2(sx * 97 + i * 331 + 23, sz * 443 + 31);
    const hz = hash2(sx * 193 + i * 269 + 41, sz * 359 + 53);
    const spanX = Math.max(1, ROOM_SECTOR - 4 - w);
    const spanZ = Math.max(1, ROOM_SECTOR - 4 - h);
    rooms.push({
      gx: sx * ROOM_SECTOR + 2 + Math.floor(hx * spanX),
      gz: sz * ROOM_SECTOR + 2 + Math.floor(hz * spanZ),
      w, h
    });
  }
  roomCache.set(key, rooms);
  return rooms;
}
function inRoom(gx, gz){
  const rooms = getRoomsInSector(Math.floor(gx / ROOM_SECTOR), Math.floor(gz / ROOM_SECTOR));
  for (let i = 0; i < rooms.length; i++){
    const r = rooms[i];
    if (gx >= r.gx && gx < r.gx + r.w && gz >= r.gz && gz < r.gz + r.h) return true;
  }
  return false;
}

function vWallOpen(i, j){ return hash2(i * 31 + 11, j * 17 + 5) < 0.80; }
function hWallOpen(i, j){ return hash2(i * 53 + 7, j * 41 + 19) < 0.44; }

function terrainIsWall(gx, gz){
  if (inRoom(gx, gz)) return false;
  const mx = ((gx % 2) + 2) % 2;
  const mz = ((gz % 2) + 2) % 2;
  if (mx === 1 && mz === 1) return false;
  if (mx === 0 && mz === 0) return true;
  if (mx === 0) return !vWallOpen(gx / 2, (gz - 1) / 2);
  return !hWallOpen((gx - 1) / 2, gz / 2);
}

function darkField(gx, gz){
  const nx = gx / 16, nz = gz / 16;
  const x0 = Math.floor(nx), z0 = Math.floor(nz);
  const fx = nx - x0, fz = nz - z0;
  const a = hash2(x0 * 733 + 11, z0 * 977 + 43);
  const b = hash2((x0 + 1) * 733 + 11, z0 * 977 + 43);
  const c = hash2(x0 * 733 + 11, (z0 + 1) * 977 + 43);
  const d = hash2((x0 + 1) * 733 + 11, (z0 + 1) * 977 + 43);
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const top = a + (b - a) * sx;
  const bot = c + (d - c) * sx;
  return top + (bot - top) * sz;
}
function isDarkTile(gx, gz){
  if (inRoom(gx, gz)) return false;
  return darkField(gx, gz) < 0.30;
}
function worldIsDark(wx, wz){
  return isDarkTile(Math.floor(wx / CS), Math.floor(wz / CS));
}

const exitWalls = [];
const exitWallSet = new Set();
(function pickExits(){
  let tries = 0;
  while (exitWalls.length < EXIT_COUNT && tries++ < 80000){
    const gx = Math.floor(hash2(tries * 17 + 3, 0xA11) * 180) - 30;
    const gz = Math.floor(hash2(tries * 23 + 7, 0xB22) * 180) - 30;
    if (!terrainIsWall(gx, gz)) continue;
    if (inRoom(gx, gz)) continue;
    if (Math.abs(gx - SPAWN_GX) < 6 && Math.abs(gz - SPAWN_GZ) < 6) continue;
    const key = gx + ',' + gz;
    if (exitWallSet.has(key)) continue;
    let tooClose = false;
    for (const e of exitWalls){
      if (Math.hypot(e.gx - gx, e.gz - gz) < 3){ tooClose = true; break; }
    }
    if (tooClose) continue;
    exitWalls.push({ gx, gz });
    exitWallSet.add(key);
  }
})();

function isExitWall(gx, gz){ return exitWallSet.has(gx + ',' + gz); }
function isWall(gx, gz){ return isExitWall(gx, gz) || terrainIsWall(gx, gz); }

const chunkData = new Map();
function getChunkData(cx, cz){
  const key = cx + ',' + cz;
  const cached = chunkData.get(key);
  if (cached) return cached;
  const solid = new Uint8Array(CHUNK * CHUNK);
  for (let lz = 0; lz < CHUNK; lz++){
    for (let lx = 0; lx < CHUNK; lx++){
      solid[lz * CHUNK + lx] = isWall(cx * CHUNK + lx, cz * CHUNK + lz) ? 1 : 0;
    }
  }
  const d = { solid };
  chunkData.set(key, d);
  return d;
}
function worldSolid(gx, gz){
  const cx = Math.floor(gx / CHUNK), cz = Math.floor(gz / CHUNK);
  return getChunkData(cx, cz).solid[(gz - cz * CHUNK) * CHUNK + (gx - cx * CHUNK)] === 1;
}

function makeAlbedo(S, fill){
  const d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const c = fill(x / S, y / S);
      const i = (y * S + x) * 4;
      d[i] = c[0] < 0 ? 0 : c[0] > 255 ? 255 : c[0];
      d[i+1] = c[1] < 0 ? 0 : c[1] > 255 ? 255 : c[1];
      d[i+2] = c[2] < 0 ? 0 : c[2] > 255 ? 255 : c[2];
      d[i+3] = 255;
    }
  }
  const t = new THREE.DataTexture(d, S, S, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  t.needsUpdate = true;
  return t;
}
function makeNormal(S, heightFn, strength){
  const h = new Float32Array(S * S);
  for (let y = 0; y < S; y++)
    for (let x = 0; x < S; x++) h[y * S + x] = heightFn(x / S, y / S);

  const d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const xm = (x - 1 + S) % S, xp = (x + 1) % S;
      const ym = (y - 1 + S) % S, yp = (y + 1) % S;
      const dx = (h[y * S + xp] - h[y * S + xm]) * strength;
      const dy = (h[yp * S + x] - h[ym * S + x]) * strength;
      let nx = -dx, ny = -dy, nz = 1;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      nx /= len; ny /= len; nz /= len;
      const i = (y * S + x) * 4;
      d[i] = (nx * 0.5 + 0.5) * 255;
      d[i+1] = (ny * 0.5 + 0.5) * 255;
      d[i+2] = (nz * 0.5 + 0.5) * 255;
      d[i+3] = 255;
    }
  }
  const t = new THREE.DataTexture(d, S, S, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  t.anisotropy = 8;
  t.needsUpdate = true;
  return t;
}

const wallTex = makeAlbedo(128, (u, v) => {
  if (v < 0.045) return [108, 94, 54];
  if (v > 0.965) return [218, 204, 148];
  const stripe = ((u * 8) % 1) < 0.5 ? 3 : -3;
  const grain = (n2(Math.floor(u * 256), Math.floor(v * 256)) - 0.5) * 3;
  const uneven = (n2(Math.floor(u * 6), Math.floor(v * 6)) - 0.5) * 8;
  const stain = Math.max(0, n2(Math.floor(u * 4), Math.floor(v * 4)) - 0.85) * -22;
  const grime = Math.max(0, 1 - v * 2) * -5;
  const add = stripe + grain + uneven + stain + grime;
  return [210 + add, 195 + add, 128 + add];
});

const exitWallTex = wallTex.clone();
exitWallTex.offset.set(0.27, 0.11);
exitWallTex.needsUpdate = true;

const floorTex = makeAlbedo(256, (u, v) => {
  const px = u * 256, py = v * 256;
  const base = 112;
  const f1 = n2(Math.floor(px * 8), Math.floor(py * 8)) - 0.5;
  const f2 = n2(Math.floor(px * 16), Math.floor(py * 16)) - 0.5;
  const f3 = n2(Math.floor(px * 32), Math.floor(py * 32)) - 0.5;
  const fiber = f1 * 17 + f2 * 9 + f3 * 4;
  const nap = Math.sin(py * 0.6) * 2.5;
  const damp = Math.max(0, n2(Math.floor(px * 0.05), Math.floor(py * 0.05)) - 0.55) * -40;
  const dirt = Math.max(0, n2(Math.floor(px * 0.15), Math.floor(py * 0.15)) - 0.7) * -28;
  const seamX = (px % 128) < 1 ? -9 : 0;
  const seamY = (py % 128) < 1 ? -9 : 0;
  const add = fiber + nap + damp + dirt + seamX + seamY;
  return [base + add, base * 0.86 + add, base * 0.63 + add];
});

const ceilTex = makeAlbedo(256, (u, v) => {
  const px = u * 256, py = v * 256;
  const tx = px % 128, ty = py % 128;
  const bx = Math.min(tx, 128 - tx), by = Math.min(ty, 128 - ty);
  if (bx < 3 || by < 3){
    const n = (n2(Math.floor(px * 2), Math.floor(py * 2)) - 0.5) * 6;
    return [98 + n, 94 + n, 88 + n];
  }
  const bevX = Math.min(1, (bx - 3) / 8);
  const bevY = Math.min(1, (by - 3) / 8);
  const bevShade = (1 - bevX * bevY) * -22;
  const sp1 = n2(Math.floor(px * 4), Math.floor(py * 4)) - 0.5;
  const sp2 = n2(Math.floor(px * 9), Math.floor(py * 9)) - 0.5;
  const speck = sp1 * 16 + sp2 * 7;
  const stain = Math.max(0, n2(Math.floor(px * 0.06), Math.floor(py * 0.06)) - 0.68) * -55;
  const tileVar = (hash2(Math.floor(px / 128) * 91 + 3, Math.floor(py / 128) * 173 + 7) - 0.5) * 12;
  const c = 172 + tileVar + speck + bevShade + stain;
  return [c, c - 2, c - 9];
});

const wallNormal = makeNormal(128, (u, v) => {
  return n2(Math.floor(u * 256), Math.floor(v * 256)) * 0.35 + (((u * 8) % 1) < 0.5 ? 0.5 : 0);
}, 0.6);

const floorNormal = makeNormal(256, (u, v) => {
  const px = u * 256, py = v * 256;
  return n2(Math.floor(px * 8), Math.floor(py * 8)) * 0.5 +
         n2(Math.floor(px * 16), Math.floor(py * 16)) * 0.35 +
         n2(Math.floor(px * 32), Math.floor(py * 32)) * 0.15;
}, 1.6);

const ceilNormal = makeNormal(256, (u, v) => {
  const px = u * 256, py = v * 256;
  const tx = px % 128, ty = py % 128;
  const bx = Math.min(tx, 128 - tx), by = Math.min(ty, 128 - ty);
  if (bx < 3 || by < 3) return 0;
  const edge = Math.min(1, (bx - 3) / 6) * Math.min(1, (by - 3) / 6);
  return edge * 0.6 + n2(Math.floor(px * 6), Math.floor(py * 6)) * 0.35;
}, 3.0);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1408);

const chunkMeshes = new Map();
function buildChunk(cx, cz){
  const key = cx + ',' + cz;
  if (chunkMeshes.has(key)) return;
  const data = getChunkData(cx, cz);
  const group = new THREE.Group();
  const ox = cx * CHUNK * CS, oz = cz * CHUNK * CS;

  const solidList = [];
  const tileList = [];
  const lamps = [];
  for (let lz = 0; lz < CHUNK; lz++){
    for (let lx = 0; lx < CHUNK; lx++){
      const gx = cx * CHUNK + lx, gz = cz * CHUNK + lz;
      if (data.solid[lz * CHUNK + lx]){
        if (!isExitWall(gx, gz)) solidList.push(lx, lz);
        continue;
      }
      tileList.push(lx, lz);
      if (isDarkTile(gx, gz)) continue;
      const px = ((gx % FIXTURE_EVERY) + FIXTURE_EVERY) % FIXTURE_EVERY;
      const pz = ((gz % FIXTURE_EVERY) + FIXTURE_EVERY) % FIXTURE_EVERY;
      if (px === 0 && pz === 0) lamps.push(ox + lx * CS + CS / 2, oz + lz * CS + CS / 2);
    }
  }

  if (solidList.length){
    const n = solidList.length / 2;
    const mesh = new THREE.InstancedMesh(wallGeo, wallMat, n);
    const m = new THREE.Matrix4();
    for (let i = 0; i < n; i++){
      m.makeTranslation(ox + solidList[i * 2] * CS + CS / 2, WH / 2, oz + solidList[i * 2 + 1] * CS + CS / 2);
      mesh.setMatrixAt(i, m);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
  }

  for (const e of exitWalls){
    if (Math.floor(e.gx / CHUNK) !== cx || Math.floor(e.gz / CHUNK) !== cz) continue;
    const em = new THREE.Mesh(wallGeo, exitWallMat);
    em.position.set(e.gx * CS + CS / 2, WH / 2, e.gz * CS + CS / 2);
    em.castShadow = true;
    em.receiveShadow = true;
    group.add(em);
  }

  const tn = tileList.length / 2;
  if (tn > 0){
    const floorInst = new THREE.InstancedMesh(floorTileGeo, floorMat, tn);
    const ceilInst = new THREE.InstancedMesh(ceilTileGeo, ceilMat, tn);
    const m = new THREE.Matrix4();
    for (let i = 0; i < tn; i++){
      const wx = ox + tileList[i * 2] * CS + CS / 2;
      const wz = oz + tileList[i * 2 + 1] * CS + CS / 2;
      m.makeTranslation(wx, 0, wz); floorInst.setMatrixAt(i, m);
      m.makeTranslation(wx, WH, wz); ceilInst.setMatrixAt(i, m);
    }
    floorInst.instanceMatrix.needsUpdate = true;
    ceilInst.instanceMatrix.needsUpdate = true;
    floorInst.receiveShadow = true;
    ceilInst.receiveShadow = true;
    group.add(floorInst);
    group.add(ceilInst);
  }

  if (lamps.length){
    const n = lamps.length / 2;
    const lmesh = new THREE.InstancedMesh(lumGeo, lumMat, n);
    const m = new THREE.Matrix4();
    const c = new THREE.Color(1.0, 0.94, 0.72);
    for (let i = 0; i < n; i++){
      m.makeTranslation(lamps[i * 2], WH - 0.05, lamps[i * 2 + 1]);
      m.scale(new THREE.Vector3(2.6, 1, 0.6));
      lmesh.setMatrixAt(i, m);
      lmesh.setColorAt(i, c);
    }
    lmesh.instanceMatrix.needsUpdate = true;
    if (lmesh.instanceColor) lmesh.instanceColor.needsUpdate = true;
    group.add(lmesh);
  }

  scene.add(group);
  chunkMeshes.set(key, group);
}
function disposeChunk(cx, cz){
  const key = cx + ',' + cz;
  const g = chunkMeshes.get(key);
  if (!g) return;
  scene.remove(g);
  g.traverse(o => { if (o.isInstancedMesh) o.dispose(); });
  chunkMeshes.delete(key);
}

/* ── Light pools ──
   Non-shadow point lights: cheap fill for the bulk of the level.
   Shadow-casting spotlights: the 2 nearest ceiling lamps, wide downward cone. */
const lampPool = [];
for (let i = 0; i < MAX_ACTIVE_LAMPS; i++){
  const l = new THREE.PointLight(0xffe8b8, 0, LAMP_RANGE, 1.5);
  l.position.set(0, LAMP_HEIGHT, 0);

}

const shadowLamps = [];
for (let i = 0; i < MAX_SHADOW_LAMPS; i++){
  const s = new THREE.SpotLight(0xffe8b8, 0, LAMP_RANGE + 2, Math.PI / 2.8, 0.6, 1.4);
  s.position.set(0, LAMP_HEIGHT, 0);
  s.castShadow = true;
  s.shadow.mapSize.set(512, 512);
  s.shadow.camera.near = 0.5;
  s.shadow.camera.far = LAMP_RANGE + 2;
  s.shadow.bias = -0.0012;

  const t = new THREE.Object3D();

  scene.add(t);
  s.target = t;
  scene.add(s);
  shadowLamps.push({ light: s, target: t });
}

let lampSortTimer = 0;
const LIGHT_SCAN_R = Math.ceil(LAMP_RANGE / (CS * LIGHT_STRIDE)) + 1;

function updateLamps(dt){
  lampSortTimer -= dt;
  if (lampSortTimer > 0) return;
  lampSortTimer = 0.25;

  const arr = [];
  const gx0 = Math.floor(rover.x / CS);
  const gz0 = Math.floor(rover.z / CS);
  const parityX = ((gx0 % LIGHT_STRIDE) + LIGHT_STRIDE) % LIGHT_STRIDE;
  const parityZ = ((gz0 % LIGHT_STRIDE) + LIGHT_STRIDE) % LIGHT_STRIDE;
  const ox = gx0 - parityX;
  const oz = gz0 - parityZ;

  for (let dz = -LIGHT_SCAN_R; dz <= LIGHT_SCAN_R; dz++){
    for (let dx = -LIGHT_SCAN_R; dx <= LIGHT_SCAN_R; dx++){
      const ax = ox + dx * LIGHT_STRIDE;
      const az = oz + dz * LIGHT_STRIDE;
      if (isDarkTile(ax, az)) continue;
      if (worldSolid(ax, az)) continue;
      const wx = ax * CS + CS / 2, wz = az * CS + CS / 2;
      const ddx = wx - rover.x, ddz = wz - rover.z;
      const d2 = ddx * ddx + ddz * ddz;
      if (d2 > MAX_LAMP_D2) continue;
      arr.push({ x: wx, z: wz, d2 });
    }
  }
  arr.sort((p, q) => p.d2 - q.d2);

  /* Closest few become shadow-casting spotlights. */
  for (let i = 0; i < MAX_SHADOW_LAMPS; i++){
    const slot = shadowLamps[i];
    if (i < arr.length){
      const p = arr[i];
      slot.light.position.set(p.x, LAMP_HEIGHT, p.z);
      slot.target.position.set(p.x, 0, p.z);
      slot.light.intensity = LAMP_INTENSITY * 1.15;
    } else {
      slot.light.intensity = 0;
    }
  }

  /* The rest are non-shadow point lights. Skip the ones we just used. */
  for (let i = 0; i < MAX_ACTIVE_LAMPS; i++){
    const L = lampPool[i];
    const src = arr[i + MAX_SHADOW_LAMPS];
    if (src){
      L.position.set(src.x, LAMP_HEIGHT, src.z);
      L.intensity = LAMP_INTENSITY;
    } else {
      L.intensity = 0;
    }
  }
}

function makeDustSprite(){
  const s = 32;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,238,200,1)');
  g.addColorStop(0.35, 'rgba(255,230,180,0.45)');
  g.addColorStop(1, 'rgba(255,220,160,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const dustVel = new Float32Array(DUST_COUNT * 3);

for (let i = 0; i < DUST_COUNT; i++){
  const i3 = i * 3;
  dustPos[i3] = (Math.random() - 0.5) * DUST_BOX.x;
  dustPos[i3 + 1] = Math.random() * DUST_BOX.y + 0.15;
  dustPos[i3 + 2] = (Math.random() - 0.5) * DUST_BOX.z;
  dustVel[i3] = (Math.random() - 0.5) * 0.09;
  dustVel[i3 + 1] = -0.02 - Math.random() * 0.05;
  dustVel[i3 + 2] = (Math.random() - 0.5) * 0.09;
  dustPhase[i] = Math.random() * Math.PI * 2;
}

  size: 0.06, map: makeDustSprite(), transparent: true,
  opacity: 0.18, depthWrite: false,
  blending: THREE.AdditiveBlending, color: 0xffe0a0, sizeAttenuation: true
}));
dustPoints.frustumCulled = false;

function updateDust(dt){
  const pos = dustGeo.attributes.position.array;
  const time = performance.now() * 0.001;
  const rx = rover.x, rz = rover.z;
  const halfX = DUST_BOX.x / 2, halfZ = DUST_BOX.z / 2;
  for (let i = 0; i < DUST_COUNT; i++){
    const i3 = i * 3;
    const ph = dustPhase[i];
    pos[i3] += dustVel[i3] * dt + Math.sin(time + ph) * 0.0035;
    pos[i3 + 1] += dustVel[i3 + 1] * dt;
    pos[i3 + 2] += dustVel[i3 + 2] * dt + Math.cos(time * 0.8 + ph) * 0.0035;
    if (pos[i3 + 1] < 0.1) pos[i3 + 1] = DUST_BOX.y;
    if (pos[i3] - rx < -halfX) pos[i3] = rx + halfX;
    else if (pos[i3] - rx > halfX) pos[i3] = rx - halfX;
    if (pos[i3 + 2] - rz < -halfZ) pos[i3 + 2] = rz + halfZ;
    else if (pos[i3 + 2] - rz > halfZ) pos[i3 + 2] = rz - halfZ;
  }
  dustGeo.attributes.position.needsUpdate = true;
}

function collide(x, z){
  const r = ROVER_R;
  const x0 = Math.floor((x - r) / CS), x1 = Math.floor((x + r) / CS);
  const z0 = Math.floor((z - r) / CS), z1 = Math.floor((z + r) / CS);
  for (let gz = z0; gz <= z1; gz++){
    for (let gx = x0; gx <= x1; gx++){
      if (!worldSolid(gx, gz)) continue;
      const ax = gx * CS, az = gz * CS;
      const cx = Math.max(ax, Math.min(x, ax + CS));
      const cz = Math.max(az, Math.min(z, az + CS));
      const dx = x - cx, dz = z - cz;
      if (dx * dx + dz * dz < r * r) return true;
    }
  }
  return false;
}

function pickSpawns(count, onlyDark){
  const out = [];
  let safety = 0;
  while (out.length < count && safety++ < 20000){
    const gx = Math.floor((Math.random() - 0.5) * 200);
    const gz = Math.floor((Math.random() - 0.5) * 200);
    if (worldSolid(gx, gz)) continue;
    if (onlyDark && !isDarkTile(gx, gz)) continue;
    const wx = gx * CS + CS / 2, wz = gz * CS + CS / 2;
    const dx = wx - rover.x, dz = wz - rover.z;
    if (dx * dx + dz * dz < MONSTER_MIN_SPAWN_DIST * MONSTER_MIN_SPAWN_DIST) continue;
    let clash = false;
    for (const p of out){
      const ddx = p.x - wx, ddz = p.z - wz;
      if (ddx * ddx + ddz * ddz < 9){ clash = true; break; }
    }
    if (clash) continue;
    out.push({ x: wx, z: wz });
  }
  return out;
}

let noise = 0;
function updateNoise(dt, moving, turning){
  if (moving) noise = Math.min(1, noise + dt * 0.60);
  else if (turning) noise = Math.min(1, noise + dt * 0.28);
  else noise = Math.max(0, noise - dt * 0.42);
}

function tryStep(M, nx, nz, lightShy){
  const blockedX = collide(nx, M.z) || (lightShy && !worldIsDark(nx, M.z));
  const blockedZ = collide(M.x, nz) || (lightShy && !worldIsDark(M.x, nz));
  if (!blockedX) M.x = nx; else M.yaw += 2.4;
  if (!blockedZ) M.z = nz; else M.yaw -= 2.4;
}

function updateBacteria(M, dt){
  M.wanderTimer -= dt;
  if (M.wanderTimer <= 0){
    M.wanderTimer = 1.0 + Math.random() * 1.8;
    M.yaw += (Math.random() - 0.5) * 2.6;
  }
  const dxP = rover.x - M.x, dzP = rover.z - M.z;
  const dP = Math.hypot(dxP, dzP);
  const hearRange = BACTERIA_HEAR_BASE + noise * BACTERIA_HEAR_BONUS;

  if (dP < hearRange){
    const want = Math.atan2(dxP, dzP);
    let diff = want - M.yaw;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const turnSpeed = 2.5 + (1 - Math.min(1, dP / hearRange)) * 4.0;
    M.yaw += diff * Math.min(1, dt * turnSpeed);
    M.aggression += (1 - M.aggression) * Math.min(1, dt * 3.0);
    if (!M.alerted && dP < 8){ M.alerted = true; sfxAlert(0.55); }
  } else {
    M.aggression += (0 - M.aggression) * Math.min(1, dt * 1.5);
    if (M.aggression < 0.15) M.alerted = false;
  }

  const speed = BACTERIA_SPEED + M.aggression * (BACTERIA_CHASE_SPEED - BACTERIA_SPEED);
  const fX = Math.sin(M.yaw), fZ = Math.cos(M.yaw);
  tryStep(M, M.x + fX * speed * dt, M.z + fZ * speed * dt, false);

  M.stuckTimer += dt;
  if (M.stuckTimer > 1.2){
    if (Math.hypot(M.x - M.lastX, M.z - M.lastZ) < 0.3){
      M.yaw += Math.PI * (0.5 + Math.random());
      M.wanderTimer = 0.2;
    }
    M.lastX = M.x; M.lastZ = M.z; M.stuckTimer = 0;
  }
}

function updateSmiler(M, dt){
  M.wanderTimer -= dt;
  if (M.wanderTimer <= 0){
    M.wanderTimer = 1.2 + Math.random() * 2.0;
    M.yaw += (Math.random() - 0.5) * 2.4;
  }
  const dxP = rover.x - M.x, dzP = rover.z - M.z;
  const dP = Math.hypot(dxP, dzP);

  const seesLight = lightsOn && dP < SMILER_LIGHT_RANGE;
  const veryClose = dP < SMILER_CLOSE_RANGE;
  const detected = seesLight || veryClose;

  if (detected){
    M.aggression = Math.min(1, M.aggression + dt * 1.6);
    if (!M.alerted && dP < 12){ M.alerted = true; sfxAlert(0.85); }
  } else {
    M.aggression = Math.max(0, M.aggression - dt * 0.45);
    if (M.aggression < 0.15) M.alerted = false;
  }

  if (M.aggression > 0.12){
    const want = Math.atan2(dxP, dzP);
    let diff = want - M.yaw;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    M.yaw += diff * Math.min(1, dt * (2 + M.aggression * 5));
  }

  const speed = SMILER_SPEED + M.aggression * (SMILER_CHASE_SPEED - SMILER_SPEED);
  const fX = Math.sin(M.yaw), fZ = Math.cos(M.yaw);
  tryStep(M, M.x + fX * speed * dt, M.z + fZ * speed * dt, true);

  M.stuckTimer += dt;
  if (M.stuckTimer > 1.2){
    if (Math.hypot(M.x - M.lastX, M.z - M.lastZ) < 0.3){
      M.yaw += Math.PI * (0.5 + Math.random());
      M.wanderTimer = 0.2;
    }
    M.lastX = M.x; M.lastZ = M.z; M.stuckTimer = 0;
  }
}

function updateMonsters(dt){
  for (const M of monsters){
    if (M.type === MONSTER_BACTERIA) updateBacteria(M, dt);
    else updateSmiler(M, dt);
    const t = performance.now() * 0.003 + M.phase;
    M.mesh.position.set(M.x, Math.abs(Math.sin(t * 6)) * 0.05, M.z);
    M.mesh.rotation.y = M.yaw;
  }
}

let lastCX = 9999, lastCZ = 9999;
function streamChunks(){
  const ccx = Math.floor(rover.x / (CHUNK * CS));
  const ccz = Math.floor(rover.z / (CHUNK * CS));
  if (ccx === lastCX && ccz === lastCZ) return;
  lastCX = ccx; lastCZ = ccz;
  const wanted = new Set();
  for (let dz = -1; dz <= 1; dz++){
    for (let dx = -1; dx <= 1; dx++){
      const key = (ccx + dx) + ',' + (ccz + dz);
      wanted.add(key);
      if (!chunkMeshes.has(key)) buildChunk(ccx + dx, ccz + dz);
    }
  }
  for (const key of Array.from(chunkMeshes.keys())){
    if (!wanted.has(key)){
      const p = key.indexOf(',');
      disposeChunk(+key.slice(0, p), +key.slice(p + 1));
    }
  }
}

const sonarSCv = document.getElementById('sonarS');
const sonarSCtx = sonarSCv.getContext('2d');
const SW = sonarSCv.width, SH = sonarSCv.height;

const HIT_WALL = 1, HIT_EXIT = 2, HIT_BACTERIA = 3, HIT_SMILER = 4;
let sonarGlitch = 0;
const panel = { ctx: sonarSCtx, dir: 0, waveR: 0, hits: [] };

function castSonar(dirOffset){
  const base = rover.yaw + dirOffset;
  const halfArc = SONAR_ARC / 2;
  const startAng = base - halfArc;
  const N = SONAR_RAYS;
  const rayDist = new Float32Array(N + 1);
  const rayType = new Uint8Array(N + 1);

  for (let i = 0; i <= N; i++){
    const a = startAng + (i / N) * SONAR_ARC;
    const dx = -Math.sin(a), dz = -Math.cos(a);
    let dist = 0;
    rayDist[i] = SONAR_RANGE;
    while (dist < SONAR_RANGE){
      dist += 0.22;
      const px = rover.x + dx * dist;
      const pz = rover.z + dz * dist;
      if (worldSolid(Math.floor(px / CS), Math.floor(pz / CS))){
        rayDist[i] = dist;
        rayType[i] = isExitWall(Math.floor(px / CS), Math.floor(pz / CS)) ? HIT_EXIT : HIT_WALL;
        break;
      }
    }
  }

  const invArc = 1 / SONAR_ARC;
  function stamp(tx, tz, type){
    const dx = tx - rover.x, dz = tz - rover.z;
    const d = Math.hypot(dx, dz);
    if (d >= SONAR_RANGE) return;
    const a = Math.atan2(-dx, -dz);
    let rel = a - base;
    while (rel > Math.PI) rel -= Math.PI * 2;
    while (rel < -Math.PI) rel += Math.PI * 2;
    if (Math.abs(rel) > halfArc) return;
    const idx = Math.round(((rel + halfArc) * invArc) * N);
    if (idx < 0 || idx > N) return;
    if (d < rayDist[idx]){ rayDist[idx] = d; rayType[idx] = type; }
  }
  for (const M of monsters) stamp(M.x, M.z, M.type === MONSTER_SMILER ? HIT_SMILER : HIT_BACTERIA);

  const hits = [];
  for (let i = 0; i <= N; i++){
    if (rayType[i] === 0) continue;
    hits.push({ dist: rayDist[i], ang: startAng + (i / N) * SONAR_ARC, type: rayType[i] });
  }
  return hits;
}

function drawGlitchOn(ctx){
  if (sonarGlitch < 0.05) return;
  const bars = Math.floor(1 + sonarGlitch * 5);
  for (let i = 0; i < bars; i++){
    const y = Math.random() * SH | 0;
    const bh = 1 + (Math.random() * 3 | 0);
    ctx.fillStyle = `rgba(255,255,255,${0.10 + Math.random() * 0.22})`;
    ctx.fillRect(0, y, SW, bh);
  }
  const specks = Math.floor(50 * sonarGlitch);
  for (let i = 0; i < specks; i++){
    ctx.fillStyle = Math.random() < 0.5 ? '#fff' : '#000';
    ctx.fillRect(Math.random() * SW | 0, Math.random() * SH | 0, 1, 1);
  }
}

function drawPanel(P, dt){
  const ctx = P.ctx;
  const cx = SW / 2, cy = SH / 2;
  const maxR = SW * 0.44;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SW, SH);

  P.waveR += dt * SONAR_WAVE_SPEED;
  if (P.waveR > SONAR_RANGE){ P.waveR = 0; sfxPing(); }
  P.hits = castSonar(P.dir);

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++){
    ctx.beginPath(); ctx.arc(cx, cy, (maxR / 3) * i, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.moveTo(cx, cy - maxR);
  ctx.lineTo(cx, cy + maxR);
  ctx.moveTo(cx - maxR, cy);
  ctx.lineTo(cx + maxR, cy);
  ctx.stroke();

  const wavePx = (P.waveR / SONAR_RANGE) * maxR;
  ctx.strokeStyle = `rgba(255,255,255,${0.75 * (1 - P.waveR / SONAR_RANGE)})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, wavePx, 0, Math.PI * 2); ctx.stroke();

  const panelYaw = rover.yaw + P.dir;
  for (const h of P.hits){
    const age = P.waveR - h.dist;
    if (age < 0) continue;
    const fade = Math.max(0.12, 1 - age / 3);
    const r = (h.dist / SONAR_RANGE) * maxR;
    const rel = h.ang - panelYaw;
    const sx = cx - Math.sin(rel) * r;
    const sy = cy - Math.cos(rel) * r;

    let col;
    if (h.type === HIT_BACTERIA) col = '255, 30, 24';
    else if (h.type === HIT_SMILER) col = '255, 255, 255';
    else if (h.type === HIT_EXIT) col = '48, 255, 110';
    else col = '255, 255, 255';

    const jx = sonarGlitch > 0.3 ? (Math.random() - 0.5) * sonarGlitch * 2 : 0;
    const jy = sonarGlitch > 0.3 ? (Math.random() - 0.5) * sonarGlitch * 2 : 0;

    ctx.fillStyle = `rgba(${col},${fade})`;
    if (h.type === HIT_WALL) ctx.fillRect(sx + jx - 1, sy + jy - 1, 2, 2);
    else ctx.fillRect(sx + jx - 1.5, sy + jy - 1.5, 3, 3);
  }

  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - 1, cy - 1, 2, 2);

  ctx.fillStyle = '#7de8a0';
  ctx.beginPath();
  ctx.moveTo(cx, cy - maxR - 4);
  ctx.lineTo(cx - 4, cy - maxR + 3);
  ctx.lineTo(cx + 4, cy - maxR + 3);
  ctx.closePath();
  ctx.fill();

  drawGlitchOn(ctx);
}

let glitchAmt = 0;
let heartbeatTimer = 0;

function updateGlitch(dt){
  let mProx = 0;
  for (const M of monsters){
    const d = Math.hypot(M.x - rover.x, M.z - rover.z);
    if (d < MONSTER_GLITCH_RANGE){
      const p = 1 - d / MONSTER_GLITCH_RANGE;
      if (p > mProx) mProx = p;
    }
  }
  let wProx = 0;
  for (const e of exitWalls){
    const dW = Math.hypot(e.gx * CS + CS / 2 - rover.x, e.gz * CS + CS / 2 - rover.z);
    if (dW < WALL_GLITCH_RANGE){
      const p = 1 - dW / WALL_GLITCH_RANGE;
      if (p > wProx) wProx = p;
    }
  }
  const target = Math.max(mProx, wProx);
  glitchAmt += (target - glitchAmt) * Math.min(1, dt * 6);

  const clip = Math.min(1, noclipT / NOCLIP_TIME);
  sonarGlitch = Math.max(glitchAmt, clip * 0.9);
  if (sonarGlitch < 0.02) sonarGlitch = 0;

  if (mProx > 0.15){
    heartbeatTimer -= dt;
    if (heartbeatTimer <= 0){
      sfxHeartbeat(mProx);
      heartbeatTimer = 0.7 - mProx * 0.4;
    }
  } else heartbeatTimer = 0.3;
}

let viewDistorted = false;

    const tx = (Math.random() - 0.5) * j;

    viewEl.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(1.03)`;

      `blur(${(sonarGlitch * 2.5).toFixed(2)}px) ` +
      `contrast(${(1.05 + sonarGlitch * 0.55).toFixed(2)}) ` +
      `saturate(${(0.95 - sonarGlitch * 0.5).toFixed(2)})`;
    viewDistorted = true;
  } else if (viewDistorted){
    viewEl.style.transform = '';
    viewEl.style.filter = 'contrast(1.05) saturate(0.95)';
    viewDistorted = false;
  }
}

function teleportTo(gx, gz){
  let best = null, bestD = Infinity;
  for (let r = 0; r <= 8 && !best; r++){
    for (let dz = -r; dz <= r; dz++){
      for (let dx = -r; dx <= r; dx++){
        if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
        const tx = gx + dx, tz = gz + dz;
        if (worldSolid(tx, tz)) continue;
        const d = dx * dx + dz * dz;
        if (d < bestD){ bestD = d; best = { tx, tz }; }
      }
    }
  }
  if (!best) return;
  rover.x = best.tx * CS + CS / 2;
  rover.z = best.tz * CS + CS / 2;
  noclipT = 0;
  lastCX = 9999; lastCZ = 9999;
  streamChunks();
  saveGame();
}

mapEl.addEventListener('pointerdown', e => {
  if (!mapActive) return;
  e.preventDefault();
  const rect = mapEl.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width;
  const mz = (e.clientY - rect.top) / rect.height;
  if (mx < 0 || mx > 1 || mz < 0 || mz > 1) return;
  const rgx = Math.floor(rover.x / CS), rgz = Math.floor(rover.z / CS);
  teleportTo(rgx + Math.round(mx * MAP_RADIUS * 2 - MAP_RADIUS),
             rgz + Math.round(mz * MAP_RADIUS * 2 - MAP_RADIUS));
  startAudio();
});

function drawMap(){
  if (!mapActive) return;
  const ctx = mapCtx, S = MAP_SIZE;
  const rgx = Math.floor(rover.x / CS), rgz = Math.floor(rover.z / CS);

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, S, S);

  for (let dz = -MAP_RADIUS; dz < MAP_RADIUS; dz++){
    for (let dx = -MAP_RADIUS; dx < MAP_RADIUS; dx++){
      const gx = rgx + dx, gz = rgz + dz;
      let col;
      if (isExitWall(gx, gz)) col = '#2aff6e';
      else if (worldSolid(gx, gz)) col = '#6b5730';
      else if (isDarkTile(gx, gz)) col = '#1a1810';
      else col = '#4a4224';
      ctx.fillStyle = col;
      ctx.fillRect((dx + MAP_RADIUS) * MAP_PX, (dz + MAP_RADIUS) * MAP_PX, MAP_PX + 0.6, MAP_PX + 0.6);
    }
  }

  for (const M of monsters){
    const dx = M.x / CS - rgx, dz = M.z / CS - rgz;
    if (Math.abs(dx) > MAP_RADIUS || Math.abs(dz) > MAP_RADIUS) continue;
    const sx = (dx + MAP_RADIUS) * MAP_PX, sz = (dz + MAP_RADIUS) * MAP_PX;
    if (M.type === MONSTER_SMILER){
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx - 3, sz - 3, 6, 6);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillRect(sx - 6, sz - 6, 12, 12);
    } else {
      ctx.fillStyle = '#ff3020';
      ctx.fillRect(sx - 3, sz - 3, 6, 6);
      ctx.fillStyle = 'rgba(255,48,32,0.4)';
      ctx.fillRect(sx - 6, sz - 6, 12, 12);
    }
  }

  const cx = MAP_RADIUS * MAP_PX, cz = MAP_RADIUS * MAP_PX;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cz);
  ctx.lineTo(cx - Math.sin(rover.yaw) * 22, cz - Math.cos(rover.yaw) * 22);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - 3, cz - 3, 6, 6);

  ctx.strokeStyle = 'rgba(110,255,160,0.12)';
  ctx.lineWidth = 1;
  for (let i = -MAP_RADIUS; i <= MAP_RADIUS; i += 5){
    const p = (i + MAP_RADIUS) * MAP_PX;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(S, p); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(110,255,160,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, S - 2, S - 2);
}

let actx = null;
let moveGain = null;
let masterGain = null;
let stepPhase = 0;
let lastPing = 0;

function startAudio(){
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }

  masterGain = actx.createGain();
  masterGain.gain.value = 0.4;
  masterGain.connect(actx.destination);

  const droneGain = actx.createGain();
  droneGain.gain.value = 0.10;
  droneGain.connect(masterGain);

  [42, 63, 126].forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = i < 2 ? 'sawtooth' : 'sine';
    o.frequency.value = f;
    const g = actx.createGain();
    g.gain.value = i === 2 ? 0.12 : 0.30;
    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 240;
    o.connect(g); g.connect(lp); lp.connect(droneGain);
    o.start();
  });

  const humGain = actx.createGain();
  humGain.gain.value = 0.045;
  humGain.connect(masterGain);
  const hum = actx.createOscillator(); hum.type = 'sine'; hum.frequency.value = 118;
  const hum2 = actx.createOscillator(); hum2.type = 'sine'; hum2.frequency.value = 119.3;
  const humFilt = actx.createBiquadFilter();
  humFilt.type = 'bandpass'; humFilt.frequency.value = 118; humFilt.Q.value = 8;
  hum.connect(humFilt); hum2.connect(humFilt);
  humFilt.connect(humGain);
  hum.start(); hum2.start();

  moveGain = actx.createGain();
  moveGain.gain.value = 0;
  moveGain.connect(masterGain);

  const mOsc = actx.createOscillator(); mOsc.type = 'sawtooth'; mOsc.frequency.value = 48;
  const mOsc2 = actx.createOscillator(); mOsc2.type = 'square'; mOsc2.frequency.value = 36.5;
  const mFilt = actx.createBiquadFilter(); mFilt.type = 'lowpass'; mFilt.frequency.value = 220;
  mOsc.connect(mFilt); mOsc2.connect(mFilt); mFilt.connect(moveGain);
  mOsc.start(); mOsc2.start();
}

function updateMoveAudio(){
  if (!moveGain || !actx) return;
  moveGain.gain.setTargetAtTime(noise * 0.28, actx.currentTime, 0.08);
}

function sfxStep(){
  if (!actx) return;
  const t0 = actx.currentTime;
  const len = Math.floor(actx.sampleRate * 0.09);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  const decay = actx.sampleRate * 0.02;
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / decay);
  const src = actx.createBufferSource(); src.buffer = buf;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 340;
  const g = actx.createGain(); g.gain.value = 0.13;
  src.connect(lp); lp.connect(g); g.connect(masterGain);
  src.start(t0);
}

function sfxClick(){
  if (!actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(1600, t0);
  osc.frequency.exponentialRampToValueAtTime(420, t0 + 0.03);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.09, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
  osc.connect(g); g.connect(masterGain);
  osc.start(t0); osc.stop(t0 + 0.06);
}

function sfxPing(){
  if (!actx) return;
  const t0 = actx.currentTime;
  if (t0 - lastPing < 0.35) return;
  lastPing = t0;
  const o = actx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(1350, t0);
  o.frequency.exponentialRampToValueAtTime(900, t0 + 0.12);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.035, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.20);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + 0.22);
}

function sfxAlert(vol){
  if (!actx) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator();
  o.type = 'triangle';
  o.frequency.setValueAtTime(420, t0);
  o.frequency.exponentialRampToValueAtTime(140, t0 + 0.45);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.16 * vol, t0 + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + 0.6);
}

function sfxHeartbeat(vol){
  if (!actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(65, t0);
  osc.frequency.exponentialRampToValueAtTime(30, t0 + 0.16);
  const g = actx.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(0.35 * vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
  osc.connect(g); g.connect(masterGain);
  osc.start(t0); osc.stop(t0 + 0.28);
}

function sfxCatch(){
  if (!actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, t0);
  osc.frequency.exponentialRampToValueAtTime(55, t0 + 2.4);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.22, t0 + 0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.6);
  osc.connect(g); g.connect(masterGain);
  osc.start(t0); osc.stop(t0 + 2.7);
}

function sfxWin(){
  if (!actx) return;
  const t0 = actx.currentTime;
  [261.63, 329.63, 392.00, 523.25].forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const g = actx.createGain();
    const start = t0 + i * 0.22;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.20, start + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 1.6);
    o.connect(g); g.connect(masterGain);
    o.start(start); o.stop(start + 1.7);
  });
}

const bootEl = document.getElementById('boot');
const bootLog = document.getElementById('bootLog');
const bootFill = document.getElementById('bootFill');
const bootPct = document.getElementById('bootPct');
const bootEnter = document.getElementById('bootEnter');

const BOOT_LINES = [
  { at: 0, text: '> ROVER OS v0.9.0' },
  { at: 3, text: '> LEVEL 0 SURVEY UNIT' },
  { at: 6, text: '' },
  { at: 9, text: 'BIOS .................... OK' },
  { at: 16, text: 'MEMORY .................. OK' },
  { at: 23, text: 'SENSOR ARRAY ............ OK' },
  { at: 30, text: 'CAMERA FEED ............. OK' },
  { at: 37, text: 'REAR SONAR .............. OK' },
  { at: 43, text: 'LIGHT MODULE ............ OK' },
  { at: 50, text: 'SHADOW RENDER ........... OK' },
  { at: 56, text: 'MOTOR DRIVERS ........... OK' },
  { at: 61, text: 'GYRO .................... OK' },
  { at: 65, text: 'POWER CELL .............. 84%' },
  { at: 68, text: '' },
  { at: 71, text: 'MAPPING SUBSTRUCTURE...' },
  { at: 76, text: 'SHADOW PIPELINE:  ENABLED' },
  { at: 80, text: 'FLUORESCENT GRID: FULL COVERAGE' },
  { at: 84, text: 'HOSTILE SIGNATURES: 22' },
  { at: 87, text: 'BACTERIA:  14  //  EVERYWHERE' },
  { at: 90, text: 'SMILERS:    8  //  LIGHT-SEEKING' },
  { at: 93, text: 'MOVEMENT NOISE ATTRACTS BACTERIA' },
  { at: 96, text: savedGame ? 'AUTOSAVE FOUND // RESUMING' : 'NO SAVE // NEW SURVEY' },
  { at: 99, text: '> READY.' }
];

let bootPctVal = 0, bootLineIdx = 0, bootDone = false;
function bootStep(){
  bootPctVal = Math.min(100, bootPctVal + 0.8 + Math.random() * 3.2);
  bootPct.textContent = Math.floor(bootPctVal) + '%';
  bootFill.style.width = bootPctVal + '%';
  while (bootLineIdx < BOOT_LINES.length && BOOT_LINES[bootLineIdx].at <= bootPctVal){
    const line = document.createElement('div');
    line.textContent = BOOT_LINES[bootLineIdx].text || '\u00A0';
    bootLog.appendChild(line);
    bootLineIdx++;
    bootLog.scrollTop = bootLog.scrollHeight;
  }
  if (bootPctVal < 100) setTimeout(bootStep, 28 + Math.random() * 55);
  else { bootDone = true; bootEnter.classList.add('enabled'); bootEnter.focus(); }
}
bootStep();

function enterGame(){
  if (!bootDone || bootEl.classList.contains('hidden')) return;
  bootEl.classList.add('hidden');
  startAudio();
  saveGame();
  clockRunning = !caughtActive && !won;
  lastNow = performance.now();
}
bootEnter.addEventListener('click', enterGame);
addEventListener('keydown', e => { if (bootDone && e.key === 'Enter') enterGame(); });

const input = { forward: false, back: false, left: false, right: false };
let lightsOn = savedGame?.lightsOn ?? true;

function bindHold(id, key){
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    input[key] = true;
    startAudio();
  });
  const up = () => { input[key] = false; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
}
bindHold('bF', 'forward');
bindHold('bB', 'back');
bindHold('bL', 'left');
bindHold('bR', 'right');

const bLightEl = document.getElementById('bLight');
bLightEl.textContent = lightsOn ? 'LIGHT' : 'DARK';
frontLight.visible = backLight.visible = lightsOn;
bLightEl.addEventListener('click', () => {
  lightsOn = !lightsOn;
  frontLight.visible = backLight.visible = lightsOn;
  bLightEl.textContent = lightsOn ? 'LIGHT' : 'DARK';
  sfxClick();
  saveGame();
  startAudio();
});

if (savedGame?.rover){
  rover.x = savedGame.rover.x;
  rover.z = savedGame.rover.z;
  rover.yaw = savedGame.rover.yaw;
  if (collide(rover.x, rover.z)){
    rover.x = SPAWN_GX * CS + CS / 2;
    rover.z = SPAWN_GZ * CS + CS / 2;
  }
  if (Array.isArray(savedGame.monsters) && savedGame.monsters.length === monsters.length){
    for (let i = 0; i < monsters.length; i++){
      const s = savedGame.monsters[i];
      if (typeof s.x === 'number') monsters[i].x = s.x;
      if (typeof s.z === 'number') monsters[i].z = s.z;
      if (typeof s.yaw === 'number') monsters[i].yaw = s.yaw;
      if (typeof s.wanderTimer === 'number') monsters[i].wanderTimer = s.wanderTimer;
    }
  }
}

streamChunks();

const noiseFill = document.getElementById('noiseBarFill');
const clock = new THREE.Clock();
let exposure = 1.15;
let bobPhase = 0;

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  const now = performance.now();
  if (clockRunning && bootDone && !won && !caughtActive) clockMs += Math.min(now - lastNow, 100);
  lastNow = now;
  clockEl.textContent = formatTime(clockMs);

  if (graceTimer > 0) graceTimer = Math.max(0, graceTimer - dt);

  if (won || caughtActive){
    updateDust(dt);
    updateGlitch(dt);
    applyViewGlitch();
    updateLamps(dt);
    updateMoveAudio();
    renderer.render(scene, cam);
    drawPanel(panel, dt);
    drawMap();
    return;
  }

  const turning = input.left || input.right;
  if (input.left) rover.yaw += TURN_SPEED * dt;
  if (input.right) rover.yaw -= TURN_SPEED * dt;

  const fX = -Math.sin(rover.yaw), fZ = -Math.cos(rover.yaw);
  let dir = 0;
  if (input.forward) dir += 1;
  if (input.back) dir -= 1;
  const sp = dir > 0 ? MOVE_SPEED : BACK_SPEED;

  if (!collide(rover.x + fX * dir * sp * dt, rover.z)) rover.x += fX * dir * sp * dt;
  if (!collide(rover.x, rover.z + fZ * dir * sp * dt)) rover.z += fZ * dir * sp * dt;

  updateNoise(dt, dir !== 0, turning);
  noiseFill.style.width = (noise * 100).toFixed(0) + '%';

  if (dir !== 0){
    const checkX = rover.x + fX * dir * (ROVER_R + 0.25);
    const checkZ = rover.z + fZ * dir * (ROVER_R + 0.25);
    if (isExitWall(Math.floor(checkX / CS), Math.floor(checkZ / CS))){
      if (noclipT === 0) stats.noclipBumps++;
      noclipT += dt;
      if (noclipT > NOCLIP_TIME) triggerWin();
    } else noclipT = Math.max(0, noclipT - dt * 2);

    stepPhase += dt * 4.8;
    if (stepPhase >= 1){ stepPhase -= 1; sfxStep(); }
  } else {
    noclipT = Math.max(0, noclipT - dt * 2);
    stepPhase = 0;
  }

  if (dir !== 0) bobPhase += dt * 9.5;
  const bob = dir !== 0 ? Math.sin(bobPhase) * 0.018 : 0;
  cam.position.set(rover.x, EYE_Y + bob, rover.z);
  cam.rotation.set(-0.06, rover.yaw, 0, 'YXZ');

  if (Math.random() < dt * 11) flickTarget = 6.4 + Math.random() * 1.8;
  if (lightsOn){
    frontLight.intensity += (flickTarget - frontLight.intensity) * Math.min(1, dt * 12);
    backLight.intensity += (flickTarget * 0.5 - backLight.intensity) * Math.min(1, dt * 12);
  } else {
    frontLight.intensity = backLight.intensity = 0;
  }

  frontLight.position.set(rover.x, EYE_Y, rover.z);
  frontTarget.position.set(rover.x + fX * 8, EYE_Y - 0.2, rover.z + fZ * 8);
  backLight.position.set(rover.x, EYE_Y, rover.z);
  backTarget.position.set(rover.x - fX * 6, EYE_Y - 0.2, rover.z - fZ * 6);

  updateMonsters(dt);
  updateDust(dt);
  updateLamps(dt);
  updateMoveAudio();

  if (graceTimer <= 0){
    for (const M of monsters){
      if (Math.hypot(M.x - rover.x, M.z - rover.z) < CAUGHT_DIST){ triggerCaught(); break; }
    }
  }

  updateGlitch(dt);
  applyViewGlitch();

  const clipP = Math.min(1, noclipT / NOCLIP_TIME);
  const targetExp = 1.15 + clipP * 0.8;
  exposure += (targetExp - exposure) * Math.min(1, dt * 8);
  renderer.toneMappingExposure = exposure;

  streamChunks();
  renderer.render(scene, cam);
  drawPanel(panel, dt);
  drawMap();
}

tick();
</script>
