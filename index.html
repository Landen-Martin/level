{

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const CS = 3.0;
const WH = 3.0;
const CHUNK = 24;
const EYE_Y = 0.55;
const ROVER_R = 0.35;
const TURN_SPEED = 2.4;
const MOVE_SPEED = 2.2;
const BACK_SPEED = 1.4;
const NOCLIP_TIME = 0.5;
const RES = 512;

const SPAWN_GX = 1, SPAWN_GZ = 1;

const EPOCH_DURATION_MS = 5000;
const SAFE_RADIUS = 25;
let layoutEpoch = 0;
let epochAnchorX = SPAWN_GX;
let epochAnchorZ = SPAWN_GZ;

const MONSTER_BACTERIA = 0;
const MONSTER_SMILER = 1;
const BACTERIA_COUNT = 14;
const SMILER_COUNT = 8;
const MONSTER_MIN_SPAWN_DIST = 15;

const BACTERIA_SPEED = 0.85;
const BACTERIA_CHASE_SPEED = 2.60;
const BACTERIA_HEAR_BASE = 5.5;
const BACTERIA_HEAR_BONUS = 30.0;
const SMILER_SPEED = 0.70;
const SMILER_CHASE_SPEED = 3.10;
const SMILER_LIGHT_RANGE = 18.0;
const SMILER_CLOSE_RANGE = 3.6;

const SONAR_RANGE = 16;
const SONAR_RAYS = 48;
const SONAR_ARC = Math.PI * 2;
const SONAR_WAVE_SPEED = 9.0;
const SONAR_STEP = 0.5;

const MONSTER_GLITCH_RANGE = 12.0;
const WALL_GLITCH_RANGE = 10.0;

const ROOM_SECTOR = 40;
const CAUGHT_DIST = 1.55;
const GRACE_AFTER_LOAD = 2.5;

const FIXTURE_EVERY = 1;
const LIGHT_STRIDE = 1;
const MAX_ACTIVE_LAMPS = 14;
const MAX_SHADOW_LAMPS = 1;
const LAMP_RANGE = 12;
const LAMP_INTENSITY = 4.0;
const LAMP_HEIGHT = WH - 0.30;
const MAX_LAMP_D2 = LAMP_RANGE * LAMP_RANGE;

const EXIT_BLOCK  = 8;
const EXIT_CHANCE = 0.35;

/* ═══ SAVE ═══ */
const SAVE_KEY = 'rover_level0_save';
const SAVE_INTERVAL_MS = 1000;

function isValidSave(s){
  if (!s || typeof s !== 'object') return false;
  if (typeof s.seed !== 'number' || !isFinite(s.seed)) return false;
  if (!s.rover || typeof s.rover !== 'object') return false;
  if (typeof s.rover.x !== 'number' || !isFinite(s.rover.x)) return false;
  if (typeof s.rover.z !== 'number' || !isFinite(s.rover.z)) return false;
  if (typeof s.rover.yaw !== 'number' || !isFinite(s.rover.yaw)) return false;
  if (!Array.isArray(s.monsters)) return false;
  if (s.monsters.length !== BACTERIA_COUNT + SMILER_COUNT) return false;
  for (const m of s.monsters){
    if (!m || typeof m.x !== 'number' || typeof m.z !== 'number') return false;
    if (!isFinite(m.x) || !isFinite(m.z)) return false;
  }
  if (typeof s.playtimeMs !== 'number' || !isFinite(s.playtimeMs)) return false;
  return true;
}

let savedGame = null;
try { savedGame = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch(e){ savedGame = null; }
if (!isValidSave(savedGame)){
  savedGame = null;
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
}

const WORLD_SEED = (savedGame?.seed ?? (Math.random() * 0xFFFFFFF)) >>> 0;

function hash2(x, y){
  let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + WORLD_SEED) | 0;
  n = (n ^ (n >>> 13)) | 0;
  n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function hashEpoch(x, y, epoch){
  let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) +
           WORLD_SEED + Math.imul(epoch | 0, 1864427)) | 0;
  n = (n ^ (n >>> 13)) | 0;
  n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function n2(x, y){ return hash2(x * 8123 + 17, y * 9187 + 43); }
function mod(a, n){ return ((a % n) + n) % n; }

function getEpochForTile(gx, gz){
  const dx = gx - epochAnchorX;
  const dz = gz - epochAnchorZ;
  if (dx * dx + dz * dz <= SAFE_RADIUS * SAFE_RADIUS) return 0;
  return layoutEpoch;
}

/* ═══ STRUCTS ═══ */
const STRUCT_CELL = 48;
const PIT_CHANCE    = 0.55;
const PILLAR_CHANCE = 0.22;

const cellCache = new Map();
const CACHE_MAX = 3000;
function capCache(cache){
  if (cache.size <= CACHE_MAX) return;
  const keys = Array.from(cache.keys());
  const half = keys.length >> 1;
  for (let i = 0; i < half; i++) cache.delete(keys[i]);
}

function structW(s){ return s.len !== undefined ? s.len : s.size; }
function structD(s){ return s.w !== undefined ? s.w : s.size; }

function structOverlapsSpawn(s){
  const sw = structW(s), sd = structD(s);
  return s.x < SPAWN_GX + 14 && s.x + sw > SPAWN_GX - 14 &&
         s.z < SPAWN_GZ + 14 && s.z + sd > SPAWN_GZ - 14;
}

function getStructsInCell(cx, cz){
  const key = cx + ',' + cz;
  const cached = cellCache.get(key);
  if (cached) return cached;

  const out = [];
  const cx0 = cx * STRUCT_CELL;
  const cz0 = cz * STRUCT_CELL;
  const roll = hash2(cx * 733 + 911, cz * 977 + 137);

  if (roll < PIT_CHANCE){
    const maxOff = STRUCT_CELL - 5 - 4;
    const px = cx0 + 2 + Math.floor(hash2(cx * 97 + 11, cz * 443 + 13) * Math.max(1, maxOff));
    const pz = cz0 + 2 + Math.floor(hash2(cx * 193 + 17, cz * 359 + 19) * Math.max(1, maxOff));
    const s = { type: 'pit', x: px, z: pz, size: 5 };
    if (!structOverlapsSpawn(s)) out.push(s);
  } else if (roll < PIT_CHANCE + PILLAR_CHANCE){
    const r1 = hash2(cx * 4391 + 5, cz * 4391 + 7);
    const r2 = hash2(cx * 4391 + 9, cz * 4391 + 11);
    let size = 16 + Math.round(((r1 + r2) / 2 - 0.5) * 16);
    if (size < 12) size = 12;
    if (size > 24) size = 24;
    size = Math.floor(size / 2) * 2;
    const maxOff = Math.max(2, STRUCT_CELL - size - 4);
    const px = cx0 + 2 + Math.floor(hash2(cx * 97 + 11, cz * 443 + 13) * maxOff);
    const pz = cz0 + 2 + Math.floor(hash2(cx * 193 + 17, cz * 359 + 19) * maxOff);
    const s = { type: 'pillar', x: px, z: pz, size };
    if (!structOverlapsSpawn(s)) out.push(s);
  }

  cellCache.set(key, out);
  capCache(cellCache);
  return out;
}

function matchStruct(s, gx, gz){
  if (s.type === 'pit'){
    if (gx >= s.x && gx < s.x + s.size && gz >= s.z && gz < s.z + s.size)
      return { kind: 'pit', struct: s };
    return null;
  }
  if (s.type === 'pillar'){
    if (gx >= s.x && gx < s.x + s.size && gz >= s.z && gz < s.z + s.size)
      return { kind: 'pillar', struct: s };
    return null;
  }
  return null;
}

const tileInfoCache = new Map();
const TILE_CACHE_MAX = 40000;

function computeTileStructInfo(gx, gz){
  const cx = Math.floor(gx / STRUCT_CELL);
  const cz = Math.floor(gz / STRUCT_CELL);
  for (let dz = -1; dz <= 1; dz++){
    for (let dx = -1; dx <= 1; dx++){
      const arr = getStructsInCell(cx + dx, cz + dz);
      for (let i = 0; i < arr.length; i++){
        const r = matchStruct(arr[i], gx, gz);
        if (r) return r;
      }
    }
  }
  return null;
}

function getTileStructInfo(gx, gz){
  const key = gx * 131072 + gz;
  const hit = tileInfoCache.get(key);
  if (hit !== undefined) return hit;
  const v = computeTileStructInfo(gx, gz);
  if (tileInfoCache.size >= TILE_CACHE_MAX) tileInfoCache.clear();
  tileInfoCache.set(key, v);
  return v;
}

/* ═══ ORDINARY ROOMS ═══ */
function pickRoomDim(h){
  const t = h * 100;
  if (t < 40) return 3;
  if (t < 66) return 4;
  if (t < 83) return 5;
  if (t < 94) return 6;
  return 7;
}
const roomCache = new Map();
function getRoomsInSector(sx, sz, epoch){
  const key = epoch + ',' + sx + ',' + sz;
  const cached = roomCache.get(key);
  if (cached) return cached;
  const rooms = [];
  const count = 1 + Math.floor(hashEpoch(sx * 733 + 11, sz * 911 + 29, epoch) * 3);
  for (let i = 0; i < count; i++){
    const w = pickRoomDim(hashEpoch(sx * 131 + i * 977 + 3, sz * 577 + 7, epoch));
    const h = pickRoomDim(hashEpoch(sx * 313 + i * 541 + 13, sz * 811 + 17, epoch));
    const hx = hashEpoch(sx * 97 + i * 331 + 23, sz * 443 + 31, epoch);
    const hz = hashEpoch(sx * 193 + i * 269 + 41, sz * 359 + 53, epoch);
    const spanX = Math.max(1, ROOM_SECTOR - 4 - w);
    const spanZ = Math.max(1, ROOM_SECTOR - 4 - h);
    rooms.push({
      gx: sx * ROOM_SECTOR + 2 + Math.floor(hx * spanX),
      gz: sz * ROOM_SECTOR + 2 + Math.floor(hz * spanZ),
      w, h
    });
  }
  roomCache.set(key, rooms);
  capCache(roomCache);
  return rooms;
}
function inRoom(gx, gz){
  const epoch = getEpochForTile(gx, gz);
  const rooms = getRoomsInSector(Math.floor(gx / ROOM_SECTOR), Math.floor(gz / ROOM_SECTOR), epoch);
  for (let i = 0; i < rooms.length; i++){
    const r = rooms[i];
    if (gx >= r.gx && gx < r.gx + r.w && gz >= r.gz && gz < r.gz + r.h) return true;
  }
  return false;
}

function vWallOpenEpoch(i, j, epoch){ return hashEpoch(i * 31 + 11, j * 17 + 5, epoch) < 0.80; }
function hWallOpenEpoch(i, j, epoch){ return hashEpoch(i * 53 + 7, j * 41 + 19, epoch) < 0.44; }

/* ═══ TERRAIN ═══ */
function terrainIsWall(gx, gz){
  const info = getTileStructInfo(gx, gz);
  if (info){
    switch (info.kind){
      case 'pit': return false;
      case 'pillar': {
        const lx = gx - info.struct.x;
        const lz = gz - info.struct.z;
        return (lx % 4 === 2) && (lz % 4 === 2);
      }
    }
  }
  if (inRoom(gx, gz)) return false;
  const epoch = getEpochForTile(gx, gz);
  const mx = mod(gx, 2), mz = mod(gz, 2);
  if (mx === 1 && mz === 1) return false;
  if (mx === 0 && mz === 0) return true;
  if (mx === 0) return !vWallOpenEpoch(gx / 2, (gz - 1) / 2, epoch);
  return !hWallOpenEpoch((gx - 1) / 2, gz / 2, epoch);
}

function darkField(gx, gz){
  const nx = gx / 16, nz = gz / 16;
  const x0 = Math.floor(nx), z0 = Math.floor(nz);
  const fx = nx - x0, fz = nz - z0;
  const a = hash2(x0 * 733 + 11, z0 * 977 + 43);
  const b = hash2((x0 + 1) * 733 + 11, z0 * 977 + 43);
  const c = hash2(x0 * 733 + 11, (z0 + 1) * 977 + 43);
  const d = hash2((x0 + 1) * 733 + 11, (z0 + 1) * 977 + 43);
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const top = a + (b - a) * sx;
  const bot = c + (d - c) * sx;
  return top + (bot - top) * sz;
}
function isDarkTile(gx, gz){
  const info = getTileStructInfo(gx, gz);
  if (info) return false;
  if (inRoom(gx, gz)) return false;
  return darkField(gx, gz) < 0.30;
}
function worldIsDark(wx, wz){
  return isDarkTile(Math.floor(wx / CS), Math.floor(wz / CS));
}

function isExitWallOnBase(gx, gz){
  const bx = Math.floor(gx / EXIT_BLOCK);
  const bz = Math.floor(gz / EXIT_BLOCK);
  const h = hash2(bx * 5741 + 7, bz * 6217 + 13);
  if (h > EXIT_CHANCE) return false;
  const ox = Math.floor(hash2(bx * 311 + 5, bz * 719 + 11) * EXIT_BLOCK);
  const oz = Math.floor(hash2(bx * 811 + 3, bz * 431 + 17) * EXIT_BLOCK);
  if (gx !== bx * EXIT_BLOCK + ox || gz !== bz * EXIT_BLOCK + oz) return false;
  if (getTileStructInfo(gx, gz)) return false;
  if (inRoom(gx, gz)) return false;
  if (Math.abs(gx - SPAWN_GX) < 6 && Math.abs(gz - SPAWN_GZ) < 6) return false;
  return true;
}

/* ═══ CHUNKS ═══ */
const chunkData = new Map();
let _lastCkKey = NaN;
let _lastCkData = null;

function chunkKey(cx, cz){ return cx * 100003 + cz; }
function invalidateChunkDataCache(){ _lastCkKey = NaN; _lastCkData = null; }

function buildChunkData(cx, cz){
  const solid = new Uint8Array(CHUNK * CHUNK);
  const holes = new Uint8Array(CHUNK * CHUNK);
  const exits = new Uint8Array(CHUNK * CHUNK);
  const dark  = new Uint8Array(CHUNK * CHUNK);
  for (let lz = 0; lz < CHUNK; lz++){
    for (let lx = 0; lx < CHUNK; lx++){
      const gx = cx * CHUNK + lx, gz = cz * CHUNK + lz;
      const isWall = terrainIsWall(gx, gz) ? 1 : 0;
      const isExit = isWall && isExitWallOnBase(gx, gz) ? 1 : 0;
      solid[lz * CHUNK + lx] = isWall;
      exits[lz * CHUNK + lx] = isExit;
      const hole = (!isWall && isPitTile(gx, gz)) ? 1 : 0;
      holes[lz * CHUNK + lx] = hole;
      dark[lz * CHUNK + lx]  = (!isWall && !hole && isDarkTile(gx, gz)) ? 1 : 0;
    }
  }
  return { solid, holes, exits, dark };
}

function getChunkData(cx, cz){
  const key = chunkKey(cx, cz);
  if (key === _lastCkKey) return _lastCkData;
  let d = chunkData.get(key);
  if (!d){
    d = buildChunkData(cx, cz);
    chunkData.set(key, d);
  }
  _lastCkKey = key;
  _lastCkData = d;
  return d;
}

function worldSolid(gx, gz){
  const cx = Math.floor(gx / CHUNK), cz = Math.floor(gz / CHUNK);
  return getChunkData(cx, cz).solid[(gz - cz * CHUNK) * CHUNK + (gx - cx * CHUNK)] === 1;
}
function worldHole(gx, gz){
  const cx = Math.floor(gx / CHUNK), cz = Math.floor(gz / CHUNK);
  return getChunkData(cx, cz).holes[(gz - cz * CHUNK) * CHUNK + (gx - cx * CHUNK)] === 1;
}
function worldExit(gx, gz){
  const cx = Math.floor(gx / CHUNK), cz = Math.floor(gz / CHUNK);
  return getChunkData(cx, cz).exits[(gz - cz * CHUNK) * CHUNK + (gx - cx * CHUNK)] === 1;
}
function worldDarkBitmap(gx, gz){
  const cx = Math.floor(gx / CHUNK), cz = Math.floor(gz / CHUNK);
  return getChunkData(cx, cz).dark[(gz - cz * CHUNK) * CHUNK + (gx - cx * CHUNK)] === 1;
}

function inPitRoom(gx, gz){
  const info = getTileStructInfo(gx, gz);
  return info && info.kind === 'pit';
}
function isPitTile(gx, gz){
  const info = getTileStructInfo(gx, gz);
  if (!info || info.kind !== 'pit') return false;
  const lx = gx - info.struct.x, lz = gz - info.struct.z;
  return (lx % 2 === 0) && (lz % 2 === 0);
}
function inPillarRoom(gx, gz){
  const info = getTileStructInfo(gx, gz);
  return info && info.kind === 'pillar';
}

const HOLE_OPENING = CS * 0.70;
const HOLE_DEPTH = 3.4;
function overShaft(wx, wz){
  const gx = Math.floor(wx / CS);
  const gz = Math.floor(wz / CS);
  const info = getTileStructInfo(gx, gz);
  if (!info || info.kind !== 'pit') return false;
  const lx = gx - info.struct.x, lz = gz - info.struct.z;
  if ((lx % 2 !== 0) || (lz % 2 !== 0)) return false;
  const cx = gx * CS + CS / 2;
  const cz = gz * CS + CS / 2;
  const half = HOLE_OPENING / 2;
  return Math.abs(wx - cx) < half && Math.abs(wz - cz) < half;
}

/* ═══ TEXTURES ═══ */
function makeAlbedo(S, fill){
  const d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const c = fill(x / S, y / S);
      const i = (y * S + x) * 4;
      d[i] = c[0] < 0 ? 0 : c[0] > 255 ? 255 : c[0];
      d[i+1] = c[1] < 0 ? 0 : c[1] > 255 ? 255 : c[1];
      d[i+2] = c[2] < 0 ? 0 : c[2] > 255 ? 255 : c[2];
      d[i+3] = 255;
    }
  }
  const t = new THREE.DataTexture(d, S, S, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  t.needsUpdate = true;
  return t;
}
function makeNormal(S, heightFn, strength){
  const h = new Float32Array(S * S);
  for (let y = 0; y < S; y++)
    for (let x = 0; x < S; x++) h[y * S + x] = heightFn(x / S, y / S);
  const d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const xm = (x - 1 + S) % S, xp = (x + 1) % S;
      const ym = (y - 1 + S) % S, yp = (y + 1) % S;
      const dx = (h[y * S + xp] - h[y * S + xm]) * strength;
      const dy = (h[yp * S + x] - h[ym * S + x]) * strength;
      let nx = -dx, ny = -dy, nz = 1;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      nx /= len; ny /= len; nz /= len;
      const i = (y * S + x) * 4;
      d[i] = (nx * 0.5 + 0.5) * 255;
      d[i+1] = (ny * 0.5 + 0.5) * 255;
      d[i+2] = (nz * 0.5 + 0.5) * 255;
      d[i+3] = 255;
    }
  }
  const t = new THREE.DataTexture(d, S, S, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  t.anisotropy = 8;
  t.needsUpdate = true;
  return t;
}

function wallFill(u, v){
  if (v < 0.045) return [108, 94, 54];
  if (v > 0.965) return [218, 204, 148];
  const stripe = ((u * 8) % 1) < 0.5 ? 3 : -3;
  const grain = (n2(Math.floor(u * 256), Math.floor(v * 256)) - 0.5) * 3;
  const uneven = (n2(Math.floor(u * 6), Math.floor(v * 6)) - 0.5) * 8;
  const stain = Math.max(0, n2(Math.floor(u * 4), Math.floor(v * 4)) - 0.85) * -22;
  const grime = Math.max(0, 1 - v * 2) * -5;
  const add = stripe + grain + uneven + stain + grime;
  return [210 + add, 195 + add, 128 + add];
}

const pitWallTex = makeAlbedo(64, (u, v) => {
  const px = u * 64, py = v * 64;
  const grain = (n2(Math.floor(px * 6), Math.floor(py * 6)) - 0.5) * 24;
  const vertical = Math.sin(px * 0.35) * 6;
  const crack = Math.max(0, n2(Math.floor(px * 0.8), Math.floor(py * 4)) - 0.82) * -30;
  const depthShade = -v * 30;
  const c = 118 + grain + vertical + crack + depthShade;
  return [c, c - 2, c - 5];
});
const pitBottomTex = makeAlbedo(64, (u, v) => {
  const px = u * 64, py = v * 64;
  const grain = (n2(Math.floor(px * 4), Math.floor(py * 4)) - 0.5) * 20;
  const debris = Math.max(0, n2(Math.floor(px * 1.5), Math.floor(py * 1.5)) - 0.78) * -28;
  const c = 62 + grain + debris;
  return [c, c - 1, c - 2];
});

const rimTex = makeAlbedo(64, (u, v) => {
  const px = u * 64, py = v * 64;
  const s = ((px + py) * 0.55) % 16;
  if (s < 8) return [245, 205, 45];
  return [28, 24, 18];
});

/* ── Berber carpet: tight-knit loop pile with tweed flecks ── */
const floorTex = makeAlbedo(256, (u, v) => {
  const px = u * 256, py = v * 256;
  const ix = Math.floor(px), iy = Math.floor(py);

  const l1 = n2(ix * 3, iy * 3) - 0.5;
  const l2 = n2(ix * 5 + 733, iy * 5 + 911) - 0.5;
  const l3 = n2(ix * 2 + 17, iy * 2 + 43) - 0.5;
  const loop = l1 * 8 + l2 * 5 + l3 * 3;

  const fx = Math.floor(px / 3), fy = Math.floor(py / 3);
  const fs = n2(fx * 61 + 401, fy * 61 + 607);
  let fr = 0, fg = 0, fb = 0;
  if (fs < 0.12){ fr = -36; fg = -32; fb = -26; }
  else if (fs < 0.22){ fr = 27; fg = 23; fb = 9; }
  else if (fs < 0.29){ fr = -8; fg = 7; fb = -15; }

  const base = 124;
  return [
    base + loop + fr,
    base * 0.90 + loop + fg,
    base * 0.72 + loop + fb
  ];
});
const ceilTex = makeAlbedo(256, (u, v) => {
  const px = u * 256, py = v * 256;
  const tx = px % 128, ty = py % 128;
  const bx = Math.min(tx, 128 - tx), by = Math.min(ty, 128 - ty);
  if (bx < 3 || by < 3){
    const n = (n2(Math.floor(px * 2), Math.floor(py * 2)) - 0.5) * 6;
    return [98 + n, 94 + n, 88 + n];
  }
  const bevX = Math.min(1, (bx - 3) / 8);
  const bevY = Math.min(1, (by - 3) / 8);
  const bevShade = (1 - bevX * bevY) * -22;
  const sp1 = n2(Math.floor(px * 4), Math.floor(py * 4)) - 0.5;
  const sp2 = n2(Math.floor(px * 9), Math.floor(py * 9)) - 0.5;
  const speck = sp1 * 16 + sp2 * 7;
  const stain = Math.max(0, n2(Math.floor(px * 0.06), Math.floor(py * 0.06)) - 0.68) * -55;
  const tileVar = (hash2(Math.floor(px / 128) * 91 + 3, Math.floor(py / 128) * 173 + 7) - 0.5) * 12;
  const c = 172 + tileVar + speck + bevShade + stain;
  return [c, c - 2, c - 9];
});
const polishedFloorTex = makeAlbedo(256, (u, v) => {
  const px = u * 256, py = v * 256;
  const gridX = ((px % 128) < 2) ? -18 : 0;
  const gridY = ((py % 128) < 2) ? -18 : 0;
  const vein = Math.abs(Math.sin(u * 8 + v * 3) * Math.cos(v * 5 - u * 2)) * 10;
  const grain = (n2(Math.floor(px * 4), Math.floor(py * 4)) - 0.5) * 5;
  const c = 58 + vein + grain + gridX + gridY;
  return [c, c, c + 6];
});
const wallNormal = makeNormal(128, (u, v) => {
  return n2(Math.floor(u * 256), Math.floor(v * 256)) * 0.35 + (((u * 8) % 1) < 0.5 ? 0.5 : 0);
}, 0.6);
const floorNormal = makeNormal(256, (u, v) => {
  const px = u * 256, py = v * 256;
  const ix = Math.floor(px), iy = Math.floor(py);
  return n2(ix * 3, iy * 3) * 0.55 +
         n2(ix * 5 + 91, iy * 5 + 137) * 0.30 +
         n2(ix * 2 + 11, iy * 2 + 29) * 0.15;
}, 1.4);
const ceilNormal = makeNormal(256, (u, v) => {
  const px = u * 256, py = v * 256;
  const tx = px % 128, ty = py % 128;
  const bx = Math.min(tx, 128 - tx), by = Math.min(ty, 128 - ty);
  if (bx < 3 || by < 3) return 0;
  const edge = Math.min(1, (bx - 3) / 6) * Math.min(1, (by - 3) / 6);
  return edge * 0.6 + n2(Math.floor(px * 6), Math.floor(py * 6)) * 0.35;
}, 3.0);
const polishedFloorNormal = makeNormal(256, (u, v) => {
  const px = u * 256, py = v * 256;
  const gridX = ((px % 128) < 2) ? 0.6 : 0;
  const gridY = ((py % 128) < 2) ? 0.6 : 0;
  return n2(Math.floor(px * 4), Math.floor(py * 4)) * 0.08 - gridX - gridY;
}, 0.5);

const pitFloorRingGeo = (function(){
  const s = CS / 2;
  const h = HOLE_OPENING / 2;
  const geo = new THREE.BufferGeometry();
  const verts = [], norms = [], uvs = [], idx = [];
  let vi = 0;
  function addQuad(p1, p2, p3, p4){
    const pts = [p1, p2, p3, p4];
    for (const p of pts){
      verts.push(p[0], p[1], p[2]);
      norms.push(0, 1, 0);
      uvs.push((p[0] + s) / CS, (s - p[2]) / CS);
    }
    idx.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
    vi += 4;
  }
  addQuad([-s, 0, -s], [ s, 0, -s], [ s, 0, -h], [-s, 0, -h]);
  addQuad([-s, 0,  h], [ s, 0,  h], [ s, 0,  s], [-s, 0,  s]);
  addQuad([-s, 0, -h], [-h, 0, -h], [-h, 0,  h], [-s, 0,  h]);
  addQuad([ h, 0, -h], [ s, 0, -h], [ s, 0,  h], [ h, 0,  h]);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(norms, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  return geo;
})();

const shaftGeo = (function(){
  const s = HOLE_OPENING / 2;
  const d = HOLE_DEPTH;
  const geo = new THREE.BufferGeometry();
  const verts = [], norms = [], uvs = [], idx = [];
  let vi = 0;
  function addQuad(p1, p2, p3, p4, n){
    verts.push(...p1, ...p2, ...p3, ...p4);
    norms.push(...n, ...n, ...n, ...n);
    uvs.push(0,0, 1,0, 1,1, 0,1);
    idx.push(vi, vi+1, vi+2, vi, vi+2, vi+3);
    vi += 4;
  }
  addQuad([-s, -d, s], [s, -d, s], [s, -d, -s], [-s, -d, -s], [0, 1, 0]);
  addQuad([s, 0, s], [s, 0, -s], [s, -d, -s], [s, -d, s], [-1, 0, 0]);
  addQuad([-s, 0, -s], [-s, 0, s], [-s, -d, s], [-s, -d, -s], [1, 0, 0]);
  addQuad([-s, 0, s], [s, 0, s], [s, -d, s], [-s, -d, s], [0, 0, -1]);
  addQuad([s, 0, -s], [-s, 0, -s], [-s, -d, -s], [s, -d, -s], [0, 0, 1]);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(norms, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  return geo;
})();

const rimGeo = (function(){
  const s = HOLE_OPENING / 2;
  const t = 0.10;
  const hh = 0.06;
  const geo = new THREE.BufferGeometry();
  const verts = [], norms = [], uvs = [], idx = [];
  let vi = 0;
  function addQuad(p1, p2, p3, p4, n){
    verts.push(...p1, ...p2, ...p3, ...p4);
    norms.push(...n, ...n, ...n, ...n);
    uvs.push(0,0, 1,0, 1,1, 0,1);
    idx.push(vi, vi+1, vi+2, vi, vi+2, vi+3);
    vi += 4;
  }
  addQuad([-s - t, hh, s + t], [s + t, hh, s + t], [s + t, hh, s], [-s - t, hh, s], [0, 1, 0]);
  addQuad([s + t, hh, -s], [s + t, hh, -s - t], [-s - t, hh, -s - t], [-s - t, hh, -s], [0, 1, 0]);
  addQuad([s, hh, -s], [s, hh, s], [s + t, hh, s], [s + t, hh, -s], [0, 1, 0]);
  addQuad([-s - t, hh, -s], [-s - t, hh, s], [-s, hh, s], [-s, hh, -s], [0, 1, 0]);
  addQuad([s, 0, s], [s, 0, -s], [s, hh, -s], [s, hh, s], [-1, 0, 0]);
  addQuad([-s, 0, -s], [-s, 0, s], [-s, hh, s], [-s, hh, -s], [1, 0, 0]);
  addQuad([-s, 0, s], [s, 0, s], [s, hh, s], [-s, hh, s], [0, 0, -1]);
  addQuad([s, 0, -s], [-s, 0, -s], [-s, hh, -s], [s, hh, -s], [0, 0, 1]);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(norms, 3));

})();

/* ═══ CHUNK BUILDER ═══ */
const chunkMeshes = new Map();

const _m4 = new THREE.Matrix4();
const _lampScale = new THREE.Vector3(2.6, 1, 0.6);
const _lampColor = new THREE.Color(1.0, 0.94, 0.72);

function buildChunk(cx, cz){
  const key = cx + ',' + cz;
  if (chunkMeshes.has(key)) return;
  const data = getChunkData(cx, cz);
  const group = new THREE.Group();
  const ox = cx * CHUNK * CS, oz = cz * CHUNK * CS;

  const solidList = [];
  const tileList = [];
  const pitTileList = [];
  const shaftList = [];
  const lamps = [];

  for (let lz = 0; lz < CHUNK; lz++){
    for (let lx = 0; lx < CHUNK; lx++){
      const gx = cx * CHUNK + lx, gz = cz * CHUNK + lz;

      if (data.solid[lz * CHUNK + lx]){
        if (data.exits[lz * CHUNK + lx] === 1){
          /* no-clip wall: rendered, but no hitbox and never flickers */
          const em = new THREE.Mesh(wallGeo, exitWallMat);
          em.position.set(gx * CS + CS / 2, WH / 2, gz * CS + CS / 2);
          em.castShadow = false; em.receiveShadow = true;
          group.add(em);
        } else {
          solidList.push(lx, lz);
        }
        continue;
      }

      if (data.holes[lz * CHUNK + lx] === 1){
        pitTileList.push(lx, lz);
        shaftList.push(lx, lz);
        continue;
      }

      tileList.push(lx, lz);

      if (data.dark[lz * CHUNK + lx] === 1) continue;
      const px = mod(gx, FIXTURE_EVERY);
      const pz = mod(gz, FIXTURE_EVERY);
      if (px === 0 && pz === 0) lamps.push(ox + lx * CS + CS / 2, oz + lz * CS + CS / 2);
    }
  }

  function addInst(list, geo, mat, yPos){
    const n = list.length / 2;
    if (n === 0) return;
    const mesh = new THREE.InstancedMesh(geo, mat, n);
    const m = _m4;
    for (let i = 0; i < n; i++){
      m.makeTranslation(ox + list[i * 2] * CS + CS / 2, yPos, oz + list[i * 2 + 1] * CS + CS / 2);
      mesh.setMatrixAt(i, m);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
  }
  function addFloorCeil(list, fm, cm){
    const n = list.length / 2;
    if (n === 0) return;
    const fi = new THREE.InstancedMesh(floorTileGeo, fm, n);
    const ci = new THREE.InstancedMesh(ceilTileGeo, cm, n);
    const m = _m4;
    for (let i = 0; i < n; i++){
      const wx = ox + list[i * 2] * CS + CS / 2;
      const wz = oz + list[i * 2 + 1] * CS + CS / 2;
      m.makeTranslation(wx, 0, wz); fi.setMatrixAt(i, m);
      m.makeTranslation(wx, WH, wz); ci.setMatrixAt(i, m);
    }
    fi.instanceMatrix.needsUpdate = true;
    ci.instanceMatrix.needsUpdate = true;
    fi.receiveShadow = true; ci.receiveShadow = true;
    group.add(fi); group.add(ci);
  }

  addInst(solidList, wallGeo, wallMat, WH / 2);
  addFloorCeil(tileList, floorMat, ceilMat);

  if (pitTileList.length){
    const n = pitTileList.length / 2;
    const fi = new THREE.InstancedMesh(pitFloorRingGeo, floorMat, n);
    const ci = new THREE.InstancedMesh(ceilTileGeo, ceilMat, n);
    const m = _m4;
    for (let i = 0; i < n; i++){
      const wx = ox + pitTileList[i * 2] * CS + CS / 2;
      const wz = oz + pitTileList[i * 2 + 1] * CS + CS / 2;
      m.makeTranslation(wx, 0, wz); fi.setMatrixAt(i, m);
      m.makeTranslation(wx, WH, wz); ci.setMatrixAt(i, m);
    }
    fi.instanceMatrix.needsUpdate = true;
    ci.instanceMatrix.needsUpdate = true;
    fi.receiveShadow = true; ci.receiveShadow = true;
    group.add(fi); group.add(ci);
  }

  if (shaftList.length){
    const n = shaftList.length / 2;
    const shaftInst = new THREE.InstancedMesh(shaftGeo, pitWallMat, n);
    const bottomInst = new THREE.InstancedMesh(shaftGeo, pitBottomMat, n);
    const rimInst = new THREE.InstancedMesh(rimGeo, rimMat, n);
    const m = _m4;
    for (let i = 0; i < n; i++){
      const wx = ox + shaftList[i * 2] * CS + CS / 2;
      const wz = oz + shaftList[i * 2 + 1] * CS + CS / 2;
      m.makeTranslation(wx, 0, wz);
      shaftInst.setMatrixAt(i, m);
      bottomInst.setMatrixAt(i, m);
      m.makeTranslation(wx, 0.0, wz);
      rimInst.setMatrixAt(i, m);
    }
    shaftInst.instanceMatrix.needsUpdate = true;
    bottomInst.instanceMatrix.needsUpdate = true;
    rimInst.instanceMatrix.needsUpdate = true;
    shaftInst.castShadow = false; shaftInst.receiveShadow = true;
    bottomInst.castShadow = false; bottomInst.receiveShadow = false;
    rimInst.castShadow = true; rimInst.receiveShadow = true;
    group.add(shaftInst); group.add(bottomInst); group.add(rimInst);
  }

  if (lamps.length){
    const n = lamps.length / 2;
    const lmesh = new THREE.InstancedMesh(lumGeo, lumMat, n);
    const m = _m4;
    for (let i = 0; i < n; i++){
      m.makeTranslation(lamps[i * 2], WH - 0.05, lamps[i * 2 + 1]);
      m.scale(_lampScale);
      lmesh.setMatrixAt(i, m);
      lmesh.setColorAt(i, _lampColor);
    }
    lmesh.instanceMatrix.needsUpdate = true;
    if (lmesh.instanceColor) lmesh.instanceColor.needsUpdate = true;
    lmesh.castShadow = false;
    group.add(lmesh);
  }

  scene.add(group);
  chunkMeshes.set(key, group);
}
function disposeChunk(cx, cz){
  const key = cx + ',' + cz;
  const g = chunkMeshes.get(key);
  if (!g) return;
  scene.remove(g);
  g.traverse(o => { if (o.isInstancedMesh) o.dispose(); });
  chunkMeshes.delete(key);
  chunkData.delete(chunkKey(cx, cz));
  invalidateChunkDataCache();
}

let lampSortTimer = 0;
const LIGHT_SCAN_R = Math.ceil(LAMP_RANGE / (CS * LIGHT_STRIDE)) + 1;

function updateLamps(dt){
  lampSortTimer -= dt;
  if (lampSortTimer > 0) return;
  lampSortTimer = 0.4;

  const arr = [];
  const gx0 = Math.floor(rover.x / CS);
  const gz0 = Math.floor(rover.z / CS);
  const parityX = mod(gx0, LIGHT_STRIDE);
  const parityZ = mod(gz0, LIGHT_STRIDE);
  const ox = gx0 - parityX;
  const oz = gz0 - parityZ;

  for (let dz = -LIGHT_SCAN_R; dz <= LIGHT_SCAN_R; dz++){
    for (let dx = -LIGHT_SCAN_R; dx <= LIGHT_SCAN_R; dx++){
      const ax = ox + dx * LIGHT_STRIDE;
      const az = oz + dz * LIGHT_STRIDE;
      if (worldSolid(ax, az)) continue;
      if (worldHole(ax, az)) continue;
      if (worldDarkBitmap(ax, az)) continue;
      const wx = ax * CS + CS / 2, wz = az * CS + CS / 2;
      const ddx = wx - rover.x, ddz = wz - rover.z;
      const d2 = ddx * ddx + ddz * ddz;
      if (d2 > MAX_LAMP_D2) continue;
      arr.push({ x: wx, z: wz, d2 });
    }
  }
  arr.sort((p, q) => p.d2 - q.d2);

  for (let i = 0; i < MAX_SHADOW_LAMPS; i++){
    const slot = shadowLamps[i];
    if (i < arr.length){
      const p = arr[i];
      slot.light.position.set(p.x, LAMP_HEIGHT, p.z);
      slot.target.position.set(p.x, 0, p.z);
      slot.light.intensity = LAMP_INTENSITY * 1.15;
    } else {
      slot.light.intensity = 0;
    }
  }
  for (let i = 0; i < MAX_ACTIVE_LAMPS; i++){
    const L = lampPool[i];
    const src = arr[i + MAX_SHADOW_LAMPS];
    if (src){
      L.position.set(src.x, LAMP_HEIGHT, src.z);
      L.intensity = LAMP_INTENSITY;
    } else {
      L.intensity = 0;
    }
  }
}

/* no-clip walls carry no hitbox: they are skipped entirely by collision */
function collide(x, z){
  const r = ROVER_R;
  const x0 = Math.floor((x - r) / CS), x1 = Math.floor((x + r) / CS);
  const z0 = Math.floor((z - r) / CS), z1 = Math.floor((z + r) / CS);
  for (let gz = z0; gz <= z1; gz++){
    for (let gx = x0; gx <= x1; gx++){
      if (!worldSolid(gx, gz)) continue;
      if (worldExit(gx, gz)) continue;
      const ax = gx * CS, az = gz * CS;
      const cx = Math.max(ax, Math.min(x, ax + CS));
      const cz = Math.max(az, Math.min(z, az + CS));
      const dx = x - cx, dz = z - cz;
      if (dx * dx + dz * dz < r * r) return true;
    }
  }
  return false;
}

function pickSpawns(count, onlyDark){
  const out = [];
  let safety = 0;
  while (out.length < count && safety++ < 20000){
    const gx = Math.floor((Math.random() - 0.5) * 200);
    const gz = Math.floor((Math.random() - 0.5) * 200);
    if (worldSolid(gx, gz)) continue;
    if (worldHole(gx, gz)) continue;
    if (inPitRoom(gx, gz)) continue;
    if (onlyDark && !isDarkTile(gx, gz)) continue;
    const wx = gx * CS + CS / 2, wz = gz * CS + CS / 2;
    const dx = wx - rover.x, dz = wz - rover.z;
    if (dx * dx + dz * dz < MONSTER_MIN_SPAWN_DIST * MONSTER_MIN_SPAWN_DIST) continue;
    let clash = false;
    for (const p of out){
      const ddx = p.x - wx, ddz = p.z - wz;
      if (ddx * ddx + ddz * ddz < 9){ clash = true; break; }
    }
    if (clash) continue;
    out.push({ x: wx, z: wz });
  }
  return out;
}

let noise = 0;
function updateNoise(dt, moving, turning){
  if (moving) noise = Math.min(1, noise + dt * 0.60);
  else if (turning) noise = Math.min(1, noise + dt * 0.28);
  else noise = Math.max(0, noise - dt * 0.42);
}

function tryStep(M, nx, nz, lightShy){
  const holeX = worldHole(Math.floor(nx / CS), Math.floor(M.z / CS));
  const holeZ = worldHole(Math.floor(M.x / CS), Math.floor(nz / CS));
  const blockedX = collide(nx, M.z) || holeX || (lightShy && !worldIsDark(nx, M.z));
  const blockedZ = collide(M.x, nz) || holeZ || (lightShy && !worldIsDark(M.x, nz));
  if (!blockedX) M.x = nx; else M.yaw += 2.4;
  if (!blockedZ) M.z = nz; else M.yaw -= 2.4;
}

function updateBacteria(M, dt){
  M.wanderTimer -= dt;
  if (M.wanderTimer <= 0){
    M.wanderTimer = 1.0 + Math.random() * 1.8;
    M.yaw += (Math.random() - 0.5) * 2.6;
  }
  const dxP = rover.x - M.x, dzP = rover.z - M.z;
  const dP = Math.hypot(dxP, dzP);
  const hearRange = BACTERIA_HEAR_BASE + noise * BACTERIA_HEAR_BONUS;

  if (dP < hearRange){
    const want = Math.atan2(dxP, dzP);
    let diff = want - M.yaw;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const turnSpeed = 2.5 + (1 - Math.min(1, dP / hearRange)) * 4.0;
    M.yaw += diff * Math.min(1, dt * turnSpeed);
    M.aggression += (1 - M.aggression) * Math.min(1, dt * 3.0);
    if (!M.alerted && dP < 8){ M.alerted = true; sfxAlert(0.55); }
  } else {
    M.aggression += (0 - M.aggression) * Math.min(1, dt * 1.5);
    if (M.aggression < 0.15) M.alerted = false;
  }
  const speed = BACTERIA_SPEED + M.aggression * (BACTERIA_CHASE_SPEED - BACTERIA_SPEED);
  const fX = Math.sin(M.yaw), fZ = Math.cos(M.yaw);
  tryStep(M, M.x + fX * speed * dt, M.z + fZ * speed * dt, false);
  M.stuckTimer += dt;
  if (M.stuckTimer > 1.2){
    if (Math.hypot(M.x - M.lastX, M.z - M.lastZ) < 0.3){
      M.yaw += Math.PI * (0.5 + Math.random());
      M.wanderTimer = 0.2;
    }
    M.lastX = M.x; M.lastZ = M.z; M.stuckTimer = 0;
  }
}

function updateSmiler(M, dt){
  M.wanderTimer -= dt;
  if (M.wanderTimer <= 0){
    M.wanderTimer = 1.2 + Math.random() * 2.0;
    M.yaw += (Math.random() - 0.5) * 2.4;
  }
  const dxP = rover.x - M.x, dzP = rover.z - M.z;
  const dP = Math.hypot(dxP, dzP);
  const seesLight = lightsOn && dP < SMILER_LIGHT_RANGE;
  const veryClose = dP < SMILER_CLOSE_RANGE;
  const detected = seesLight || veryClose;
  if (detected){
    M.aggression = Math.min(1, M.aggression + dt * 1.6);
    if (!M.alerted && dP < 12){ M.alerted = true; sfxAlert(0.85); }
  } else {
    M.aggression = Math.max(0, M.aggression - dt * 0.45);
    if (M.aggression < 0.15) M.alerted = false;
  }
  if (M.aggression > 0.12){
    const want = Math.atan2(dxP, dzP);
    let diff = want - M.yaw;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    M.yaw += diff * Math.min(1, dt * (2 + M.aggression * 5));
  }
  const speed = SMILER_SPEED + M.aggression * (SMILER_CHASE_SPEED - SMILER_SPEED);
  const fX = Math.sin(M.yaw), fZ = Math.cos(M.yaw);
  tryStep(M, M.x + fX * speed * dt, M.z + fZ * speed * dt, true);
  M.stuckTimer += dt;
  if (M.stuckTimer > 1.2){
    if (Math.hypot(M.x - M.lastX, M.z - M.lastZ) < 0.3){
      M.yaw += Math.PI * (0.5 + Math.random());
      M.wanderTimer = 0.2;
    }
    M.lastX = M.x; M.lastZ = M.z; M.stuckTimer = 0;
  }
}

/* ═══ CHUNK STREAMING ═══ */
let lastCX = 9999, lastCZ = 9999;
function streamChunks(){
  const ccx = Math.floor(rover.x / (CHUNK * CS));
  const ccz = Math.floor(rover.z / (CHUNK * CS));
  if (ccx === lastCX && ccz === lastCZ) return;
  lastCX = ccx; lastCZ = ccz;
  const wanted = new Set();
  for (let dz = -1; dz <= 1; dz++){
    for (let dx = -1; dx <= 1; dx++){
      const key = (ccx + dx) + ',' + (ccz + dz);
      wanted.add(key);
      if (!chunkMeshes.has(key)) buildChunk(ccx + dx, ccz + dz);
    }
  }
  for (const key of Array.from(chunkMeshes.keys())){
    if (!wanted.has(key)){
      const p = key.indexOf(',');
      disposeChunk(+key.slice(0, p), +key.slice(p + 1));
    }
  }
}

/* ═══ EPOCH ═══ */
let lastEpochTime = performance.now();

function checkEpoch(){
  const now = performance.now();
  if (now - lastEpochTime < EPOCH_DURATION_MS) return;
  lastEpochTime = now;
  layoutEpoch++;
  epochAnchorX = Math.floor(rover.x / CS);
  epochAnchorZ = Math.floor(rover.z / CS);

  for (const key of Array.from(chunkMeshes.keys())){
    const p = key.indexOf(',');
    const ccx = +key.slice(0, p);
    const ccz = +key.slice(p + 1);
    const minGx = ccx * CHUNK, maxGx = minGx + CHUNK;
    const minGz = ccz * CHUNK, maxGz = minGz + CHUNK;
    const nearX = Math.max(minGx, Math.min(maxGx, epochAnchorX));
    const nearZ = Math.max(minGz, Math.min(maxGz, epochAnchorZ));
    const dx = nearX - epochAnchorX;
    const dz = nearZ - epochAnchorZ;
    if (dx * dx + dz * dz > SAFE_RADIUS * SAFE_RADIUS){
      disposeChunk(ccx, ccz);
    }
  }
  invalidateChunkDataCache();
  roomCache.clear();
  lastCX = 9999; lastCZ = 9999;
  streamChunks();
  sfxEpochShift();
}

/* ═══ SONAR ═══ */
const sonarSCv = document.getElementById('sonarS');
const sonarSCtx = sonarSCv.getContext('2d');
const SW = sonarSCv.width, SH = sonarSCv.height;

const HIT_WALL = 1, HIT_EXIT = 2, HIT_BACTERIA = 3, HIT_SMILER = 4;
let sonarGlitch = 0;
const panel = { ctx: sonarSCtx, dir: 0, waveR: 0, hits: [] };

function castSonar(dirOffset){
  const base = rover.yaw + dirOffset;
  const halfArc = SONAR_ARC / 2;
  const startAng = base - halfArc;
  const N = SONAR_RAYS;
  const rayDist = new Float32Array(N + 1);
  const rayType = new Uint8Array(N + 1);

  for (let i = 0; i <= N; i++){
    const a = startAng + (i / N) * SONAR_ARC;
    const dx = -Math.sin(a), dz = -Math.cos(a);
    let dist = 0;
    rayDist[i] = SONAR_RANGE;
    while (dist < SONAR_RANGE){
      dist += SONAR_STEP;
      const px = rover.x + dx * dist;
      const pz = rover.z + dz * dist;
      const tgx = Math.floor(px / CS), tgz = Math.floor(pz / CS);
      if (worldSolid(tgx, tgz)){
        rayDist[i] = dist;
        rayType[i] = worldExit(tgx, tgz) ? HIT_EXIT : HIT_WALL;
        break;
      }
    }
  }
  const invArc = 1 / SONAR_ARC;
  function stamp(tx, tz, type){
    const dx = tx - rover.x, dz = tz - rover.z;
    const d = Math.hypot(dx, dz);
    if (d >= SONAR_RANGE) return;
    const a = Math.atan2(-dx, -dz);
    let rel = a - base;
    while (rel > Math.PI) rel -= Math.PI * 2;
    while (rel < -Math.PI) rel += Math.PI * 2;
    if (Math.abs(rel) > halfArc) return;
    const idx = Math.round(((rel + halfArc) * invArc) * N);
    if (idx < 0 || idx > N) return;
    if (d < rayDist[idx]){ rayDist[idx] = d; rayType[idx] = type; }
  }
  for (const M of monsters) stamp(M.x, M.z, M.type === MONSTER_SMILER ? HIT_SMILER : HIT_BACTERIA);

  const hits = [];
  for (let i = 0; i <= N; i++){
    if (rayType[i] === 0) continue;
    hits.push({ dist: rayDist[i], ang: startAng + (i / N) * SONAR_ARC, type: rayType[i] });
  }
  return hits;
}

function drawGlitchOn(ctx){
  if (sonarGlitch < 0.05) return;
  const bars = Math.floor(1 + sonarGlitch * 5);
  for (let i = 0; i < bars; i++){
    const y = Math.random() * SH | 0;
    const bh = 1 + (Math.random() * 3 | 0);
    ctx.fillStyle = `rgba(255,255,255,${0.10 + Math.random() * 0.22})`;
    ctx.fillRect(0, y, SW, bh);
  }
  const specks = Math.floor(50 * sonarGlitch);
  for (let i = 0; i < specks; i++){
    ctx.fillStyle = Math.random() < 0.5 ? '#fff' : '#000';
    ctx.fillRect(Math.random() * SW | 0, Math.random() * SH | 0, 1, 1);
  }
}

function drawPanel(P, dt){
  const ctx = P.ctx;
  const cx = SW / 2, cy = SH / 2;
  const maxR = SW * 0.44;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SW, SH);
  P.waveR += dt * SONAR_WAVE_SPEED;
  if (P.waveR > SONAR_RANGE){ P.waveR = 0; sfxPing(); }
  P.hits = castSonar(P.dir);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++){
    ctx.beginPath(); ctx.arc(cx, cy, (maxR / 3) * i, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.moveTo(cx, cy - maxR); ctx.lineTo(cx, cy + maxR);
  ctx.moveTo(cx - maxR, cy); ctx.lineTo(cx + maxR, cy);
  ctx.stroke();
  const wavePx = (P.waveR / SONAR_RANGE) * maxR;
  ctx.strokeStyle = `rgba(255,255,255,${0.75 * (1 - P.waveR / SONAR_RANGE)})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, wavePx, 0, Math.PI * 2); ctx.stroke();
  const panelYaw = rover.yaw + P.dir;
  for (const h of P.hits){
    const age = P.waveR - h.dist;
    if (age < 0) continue;
    const fade = Math.max(0.12, 1 - age / 3);
    const r = (h.dist / SONAR_RANGE) * maxR;
    const rel = h.ang - panelYaw;
    const sx = cx - Math.sin(rel) * r;
    const sy = cy - Math.cos(rel) * r;
    let col;
    if (h.type === HIT_BACTERIA) col = '255, 30, 24';
    else if (h.type === HIT_SMILER) col = '255, 255, 255';
    else if (h.type === HIT_EXIT) col = '255, 220, 160';
    else col = '255, 255, 255';
    const jx = sonarGlitch > 0.3 ? (Math.random() - 0.5) * sonarGlitch * 2 : 0;
    const jy = sonarGlitch > 0.3 ? (Math.random() - 0.5) * sonarGlitch * 2 : 0;
    ctx.fillStyle = `rgba(${col},${fade})`;
    if (h.type === HIT_WALL) ctx.fillRect(sx + jx - 1, sy + jy - 1, 2, 2);
    else ctx.fillRect(sx + jx - 1.5, sy + jy - 1.5, 3, 3);
  }
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - 1, cy - 1, 2, 2);
  ctx.fillStyle = '#7de8a0';
  ctx.beginPath();
  ctx.moveTo(cx, cy - maxR - 4);
  ctx.lineTo(cx - 4, cy - maxR + 3);
  ctx.lineTo(cx + 4, cy - maxR + 3);
  ctx.closePath();
  ctx.fill();
  drawGlitchOn(ctx);
}

const FALL_DURATION = 1.9;
const FALL_TELEPORT_AT = 0.60 * FALL_DURATION;
let falling = false;
let fallT = 0;
let fallTeleported = false;

function startFall(){
  if (falling || caughtActive || won) return;
  falling = true;
  fallT = 0;
  fallTeleported = false;
  stats.falls++;
  input.forward = input.back = input.left = input.right = false;
  noise = 0; noclipT = 0; sonarGlitch = 0;
  viewEl.style.transform = '';
  viewEl.style.filter = 'contrast(1.05) saturate(0.95)';
  sfxFall();
}

function doFallRespawn(){
  const count = monsters.length;
  let placed = false;
  for (let attempt = 0; attempt < 500 && !placed; attempt++){
    const M = monsters[(Math.random() * count) | 0];
    const ang = Math.random() * Math.PI * 2;
    const dist = 9 + Math.random() * 8;
    const wx = M.x + Math.cos(ang) * dist;
    const wz = M.z + Math.sin(ang) * dist;
    const gx = Math.floor(wx / CS), gz = Math.floor(wz / CS);
    if (worldSolid(gx, gz)) continue;
    if (worldHole(gx, gz)) continue;
    if (inPitRoom(gx, gz)) continue;
    let ok = true;
    for (const O of monsters){
      if (Math.hypot(O.x - wx, O.z - wz) < 7.0){ ok = false; break; }
    }
    if (!ok) continue;
    rover.x = wx; rover.z = wz;
    const dx = wx - M.x, dz = wz - M.z;
    rover.yaw = Math.atan2(-dx, -dz);
    placed = true;
  }
  if (!placed){
    rover.x = SPAWN_GX * CS + CS / 2;
    rover.z = SPAWN_GZ * CS + CS / 2;
    rover.yaw = 0;
  }
  lastCX = 9999; lastCZ = 9999;
  streamChunks();
  graceTimer = Math.max(graceTimer, 1.2);
  sfxLand();
  saveGame();
}

function updateFall(dt){
  fallT += dt;
  if (!fallTeleported && fallT >= FALL_TELEPORT_AT){
    doFallRespawn();
    fallTeleported = true;
  }
  const t = Math.min(1, fallT / FALL_DURATION);
  let op, drop;
  if (t < 0.35){ const u = t / 0.35; op = u; drop = u * u * 1.8; }
  else if (t < 0.60){ const u = (t - 0.35) / 0.25; op = 1; drop = 1.8 + u * 3.2; }
  else if (t < 0.66){ op = 1; drop = 0; }
  else { const u = (t - 0.66) / 0.34; op = Math.max(0, 1 - u); drop = 0; }
  fadeEl.style.opacity = op.toFixed(3);
  const plunge = Math.min(1, t / 0.60);
  cam.position.set(rover.x, EYE_Y - drop, rover.z);
  cam.rotation.set(-0.06 - plunge * 0.85, rover.yaw + plunge * 0.55, 0, 'YXZ');
  if (fallT >= FALL_DURATION){
    falling = false;
    fadeEl.style.opacity = '0';
    cam.rotation.set(-0.06, rover.yaw, 0, 'YXZ');
  }
}

/* ═══ GLITCH ═══ */
let glitchAmt = 0;
let heartbeatTimer = 0;

let lastWallProxX = -99999, lastWallProxZ = -99999;
let cachedWallProx = 0;
let lastWallProxTime = 0;

function computeWallGlitchProx(){
  const now = performance.now();
  const dx = rover.x - lastWallProxX;
  const dz = rover.z - lastWallProxZ;
  if (dx * dx + dz * dz < 0.25 && now - lastWallProxTime < 200) return cachedWallProx;

  const gx0 = Math.floor(rover.x / CS);
  const gz0 = Math.floor(rover.z / CS);
  const R = Math.ceil(WALL_GLITCH_RANGE / CS);
  let best = 0;
  for (let dz2 = -R; dz2 <= R; dz2++){
    for (let dx2 = -R; dx2 <= R; dx2++){
      const gx = gx0 + dx2, gz = gz0 + dz2;
      if (!worldExit(gx, gz)) continue;
      const wx = gx * CS + CS / 2;
      const wz = gz * CS + CS / 2;
      const d = Math.hypot(wx - rover.x, wz - rover.z);
      if (d < WALL_GLITCH_RANGE){
        const p = 1 - d / WALL_GLITCH_RANGE;
        if (p > best) best = p;
      }
    }
  }
  lastWallProxX = rover.x; lastWallProxZ = rover.z;
  lastWallProxTime = now;
  cachedWallProx = best;
  return best;
}

function updateGlitch(dt){
  let mProx = 0;
  for (const M of monsters){
    const d = Math.hypot(M.x - rover.x, M.z - rover.z);
    if (d < MONSTER_GLITCH_RANGE){
      const p = 1 - d / MONSTER_GLITCH_RANGE;
      if (p > mProx) mProx = p;
    }
  }
  const wProx = computeWallGlitchProx();
  const target = Math.max(mProx, wProx);
  glitchAmt += (target - glitchAmt) * Math.min(1, dt * 6);
  const clip = Math.min(1, noclipT / NOCLIP_TIME);
  sonarGlitch = Math.max(glitchAmt, clip * 0.9);
  if (sonarGlitch < 0.02) sonarGlitch = 0;
  if (mProx > 0.15){
    heartbeatTimer -= dt;
    if (heartbeatTimer <= 0){
      sfxHeartbeat(mProx);
      heartbeatTimer = 0.7 - mProx * 0.4;
    }
  } else heartbeatTimer = 0.3;
}

let viewDistorted = false;
let glitchFrameParity = 0;
function applyViewGlitch(){
  glitchFrameParity ^= 1;
  if (sonarGlitch > 0.02){
    if (glitchFrameParity) return;
    const j = sonarGlitch * 7;
    const tx = (Math.random() - 0.5) * j;
    const ty = (Math.random() - 0.5) * j;
    viewEl.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(1.03)`;
    viewEl.style.filter =
      `blur(${(sonarGlitch * 2.5).toFixed(2)}px) ` +
      `contrast(${(1.05 + sonarGlitch * 0.55).toFixed(2)}) ` +
      `saturate(${(0.95 - sonarGlitch * 0.5).toFixed(2)})`;
    viewDistorted = true;
  } else if (viewDistorted){
    viewEl.style.transform = '';
    viewEl.style.filter = 'contrast(1.05) saturate(0.95)';
    viewDistorted = false;
  }
}

function teleportTo(gx, gz){
  let best = null, bestD = Infinity;
  for (let r = 0; r <= 8 && !best; r++){
    for (let dz = -r; dz <= r; dz++){
      for (let dx = -r; dx <= r; dx++){
        if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
        const tx = gx + dx, tz = gz + dz;
        if (worldSolid(tx, tz)) continue;
        if (worldHole(tx, tz)) continue;
        const d = dx * dx + dz * dz;
        if (d < bestD){ bestD = d; best = { tx, tz }; }
      }
    }
  }
  if (!best) return;
  rover.x = best.tx * CS + CS / 2;
  rover.z = best.tz * CS + CS / 2;
  noclipT = 0;
  lastCX = 9999; lastCZ = 9999;
  streamChunks();
  saveGame();
}

mapEl.addEventListener('pointerdown', e => {

  const rect = mapEl.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width;
  const mz = (e.clientY - rect.top) / rect.height;
  if (mx < 0 || mx > 1 || mz < 0 || mz > 1) return;
  const rgx = Math.floor(rover.x / CS), rgz = Math.floor(rover.z / CS);
  teleportTo(rgx + Math.round(mx * MAP_RADIUS * 2 - MAP_RADIUS),
             rgz + Math.round(mz * MAP_RADIUS * 2 - MAP_RADIUS));
  startAudio();
});

function drawMap(){
  if (!mapActive) return;
  const ctx = mapCtx, S = MAP_SIZE;
  const rgx = Math.floor(rover.x / CS), rgz = Math.floor(rover.z / CS);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, S, S);
  for (let dz = -MAP_RADIUS; dz < MAP_RADIUS; dz++){
    for (let dx = -MAP_RADIUS; dx < MAP_RADIUS; dx++){
      const gx = rgx + dx, gz = rgz + dz;
      const info = getTileStructInfo(gx, gz);
      let col;
      if (terrainIsWall(gx, gz)){
        col = worldExit(gx, gz) ? '#ffffff' : '#6b5730';
      }
      else if (worldHole(gx, gz)) col = '#2a062a';
      else if (info && info.kind === 'pit') col = '#4a3a1a';
      else if (worldDarkBitmap(gx, gz)) col = '#1a1810';
      else col = '#4a4224';
      ctx.fillStyle = col;
      ctx.fillRect((dx + MAP_RADIUS) * MAP_PX, (dz + MAP_RADIUS) * MAP_PX, MAP_PX + 0.6, MAP_PX + 0.6);
    }
  }
  for (const M of monsters){
    const dx = M.x / CS - rgx, dz = M.z / CS - rgz;
    if (Math.abs(dx) > MAP_RADIUS || Math.abs(dz) > MAP_RADIUS) continue;
    const sx = (dx + MAP_RADIUS) * MAP_PX, sz = (dz + MAP_RADIUS) * MAP_PX;
    if (M.type === MONSTER_SMILER){
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx - 3, sz - 3, 6, 6);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillRect(sx - 6, sz - 6, 12, 12);
    } else {
      ctx.fillStyle = '#ff3020';
      ctx.fillRect(sx - 3, sz - 3, 6, 6);
      ctx.fillStyle = 'rgba(255,48,32,0.4)';
      ctx.fillRect(sx - 6, sz - 6, 12, 12);
    }
  }
  const cx = MAP_RADIUS * MAP_PX, cz = MAP_RADIUS * MAP_PX;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cz);
  ctx.lineTo(cx - Math.sin(rover.yaw) * 22, cz - Math.cos(rover.yaw) * 22);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - 3, cz - 3, 6, 6);
  ctx.strokeStyle = 'rgba(110,255,160,0.12)';
  ctx.lineWidth = 1;
  for (let i = -MAP_RADIUS; i <= MAP_RADIUS; i += 5){
    const p = (i + MAP_RADIUS) * MAP_PX;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(S, p); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(110,255,160,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, S - 2, S - 2);
}

/* ═══ AUDIO ═══ */
let actx = null;
let moveGain = null;
let masterGain = null;
let stepPhase = 0;
let lastPing = 0;

let buzzChain = null;
const BUZZ_BASE_VOLUME = 0.11;
let buzzFluctTimer = 0;
let buzzCurrentMul = 0.85;
let buzzTargetMul = 1.0;

let ambientWhisperTimer = 6 + Math.random() * 12;

function startAudio(){
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  masterGain = actx.createGain();
  masterGain.gain.value = 0.4;
  masterGain.connect(actx.destination);
  const droneGain = actx.createGain();
  droneGain.gain.value = 0.10;
  droneGain.connect(masterGain);
  [42, 63, 126].forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = i < 2 ? 'sawtooth' : 'sine';
    o.frequency.value = f;
    const g = actx.createGain();
    g.gain.value = i === 2 ? 0.12 : 0.30;
    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 240;
    o.connect(g); g.connect(lp); lp.connect(droneGain);
    o.start();
  });
  const humGain = actx.createGain();
  humGain.gain.value = 0.045;
  humGain.connect(masterGain);
  const hum = actx.createOscillator(); hum.type = 'sine'; hum.frequency.value = 118;
  const hum2 = actx.createOscillator(); hum2.type = 'sine'; hum2.frequency.value = 119.3;
  const humFilt = actx.createBiquadFilter();
  humFilt.type = 'bandpass'; humFilt.frequency.value = 118; humFilt.Q.value = 8;
  hum.connect(humFilt); hum2.connect(humFilt);
  humFilt.connect(humGain);
  hum.start(); hum2.start();
  moveGain = actx.createGain();
  moveGain.gain.value = 0;
  moveGain.connect(masterGain);
  const mOsc = actx.createOscillator(); mOsc.type = 'sawtooth'; mOsc.frequency.value = 48;
  const mOsc2 = actx.createOscillator(); mOsc2.type = 'square'; mOsc2.frequency.value = 36.5;
  const mFilt = actx.createBiquadFilter(); mFilt.type = 'lowpass'; mFilt.frequency.value = 220;
  mOsc.connect(mFilt); mOsc2.connect(mFilt); mFilt.connect(moveGain);
  mOsc.start(); mOsc2.start();

  startBuzz();
}

function startBuzz(){
  if (!actx || buzzChain) return;
  const g = actx.createGain();
  g.gain.value = 0;
  g.connect(masterGain);

  [60, 120, 180, 240, 300].forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = i === 0 ? 'sawtooth' : 'sine';
    o.frequency.value = f;
    const og = actx.createGain();

    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 900;
    o.connect(og); og.connect(lp); lp.connect(g);
    o.start();
  });

  const b1 = actx.createOscillator();

function playWhisper(){
  if (!actx) return;
  const t0 = actx.currentTime;
  const dur = 0.7 + Math.random() * 1.6;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  const syllables = 2 + Math.floor(Math.random() * 4);
  for (let i = 0; i < len; i++){
    const p = i / len;
    const env = Math.sin(p * Math.PI);
    const syl = 0.4 + 0.6 * Math.abs(Math.sin(p * Math.PI * syllables));
    d[i] = (Math.random() * 2 - 1) * env * syl;
  }
  const src = actx.createBufferSource(); src.buffer = buf;

  const f1 = actx.createBiquadFilter();
  f1.type = 'bandpass'; f1.frequency.value = 450 + Math.random() * 500; f1.Q.value = 5;
  const f2 = actx.createBiquadFilter();
  f2.type = 'bandpass'; f2.frequency.value = 1400 + Math.random() * 1400; f2.Q.value = 7;
  const f3 = actx.createBiquadFilter();
  f3.type = 'bandpass'; f3.frequency.value = 2600 + Math.random() * 1400; f3.Q.value = 9;

  const g = actx.createGain();
  g.gain.value = 0.09 + Math.random() * 0.05;

  const pan = actx.createStereoPanner ? actx.createStereoPanner() : null;
  if (pan) pan.pan.value = (Math.random() - 0.5) * 1.6;

  src.connect(f1); src.connect(f2); src.connect(f3);
  if (pan){
    f1.connect(pan); f2.connect(pan); f3.connect(pan); pan.connect(g);
  } else {
    f1.connect(g); f2.connect(g); f3.connect(g);
  }
  g.connect(masterGain);
  src.start(t0);
  src.stop(t0 + dur + 0.05);
}

function playVoice(){
  if (!actx) return;
  const t0 = actx.currentTime;
  const dur = 0.7 + Math.random() * 1.0;
  const basePitch = 130 + Math.random() * 140;

  const carrier = actx.createOscillator();
  carrier.type = 'sine';
  carrier.frequency.setValueAtTime(basePitch, t0);
  const endPitch = basePitch * (0.85 + Math.random() * 0.35);
  carrier.frequency.linearRampToValueAtTime(endPitch, t0 + dur);

  const h2 = actx.createOscillator(); h2.type = 'sine';
  h2.frequency.setValueAtTime(basePitch * 2, t0);
  h2.frequency.linearRampToValueAtTime(endPitch * 2, t0 + dur);
  const h3 = actx.createOscillator(); h3.type = 'sine';
  h3.frequency.setValueAtTime(basePitch * 3, t0);
  h3.frequency.linearRampToValueAtTime(endPitch * 3, t0 + dur);

  const lfo = actx.createOscillator(); lfo.type = 'sine';
  lfo.frequency.value = 4 + Math.random() * 3;
  const lfoGain = actx.createGain();
  lfoGain.gain.value = 4 + Math.random() * 6;
  lfo.connect(lfoGain);
  lfoGain.connect(carrier.frequency);

  const f1 = actx.createBiquadFilter();
  f1.type = 'bandpass'; f1.frequency.value = 600 + Math.random() * 300; f1.Q.value = 4;
  const f2 = actx.createBiquadFilter();
  f2.type = 'bandpass'; f2.frequency.value = 1300 + Math.random() * 900; f2.Q.value = 5;

  const h2g = actx.createGain(); h2g.gain.value = 0.4;
  const h3g = actx.createGain(); h3g.gain.value = 0.15;
  carrier.connect(f1); carrier.connect(f2);
  h2.connect(h2g); h2g.connect(f1); h2g.connect(f2);
  h3.connect(h3g); h3g.connect(f1); h3g.connect(f2);

  const g = actx.createGain();
  const peak = 0.06 + Math.random() * 0.05;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + 0.10);
  g.gain.setValueAtTime(peak, t0 + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  const pan = actx.createStereoPanner ? actx.createStereoPanner() : null;
  if (pan) pan.pan.value = (Math.random() - 0.5) * 1.4;

  if (pan){
    f1.connect(pan); f2.connect(pan); pan.connect(g);
  } else {
    f1.connect(g); f2.connect(g);
  }
  g.connect(masterGain);

  carrier.start(t0); carrier.stop(t0 + dur + 0.1);
  h2.start(t0); h2.stop(t0 + dur + 0.1);
  h3.start(t0); h3.stop(t0 + dur + 0.1);
  lfo.start(t0); lfo.stop(t0 + dur + 0.1);
}

function playScratchCluster(){
  if (!actx) return;
  const t0 = actx.currentTime;
  const count = 4 + Math.floor(Math.random() * 5);
  const startPan = (Math.random() - 0.5) * 1.6;
  const endPan = (Math.random() - 0.5) * 1.6;
  const spread = 0.05 + Math.random() * 0.10;
  for (let i = 0; i < count; i++){
    const at = t0 + i * spread;
    const t = count > 1 ? i / (count - 1) : 0;
    const panVal = startPan + (endPan - startPan) * t;
    playSingleScratch(at, panVal);
  }
}

function updateAmbient(dt){
  if (!actx || !buzzChain) return;

  buzzFluctTimer -= dt;
  if (buzzFluctTimer <= 0){
    buzzFluctTimer = 0.06 + Math.random() * 0.45;
    const r = Math.random();
    if (r < 0.05){
      buzzTargetMul = 0.04 + Math.random() * 0.10;
    } else if (r < 0.20){
      buzzTargetMul = 1.7 + Math.random() * 1.4;
    } else {
      buzzTargetMul = 0.65 + Math.random() * 0.70;
    }
  }
  buzzCurrentMul += (buzzTargetMul - buzzCurrentMul) * Math.min(1, dt * 14);

  const gx = Math.floor(rover.x / CS);
  const gz = Math.floor(rover.z / CS);
  const inDark = isDarkTile(gx, gz);
  const target = inDark ? 0 : BUZZ_BASE_VOLUME * buzzCurrentMul;
  buzzChain.gain.gain.setTargetAtTime(target, actx.currentTime, 0.10);

  ambientWhisperTimer -= dt;
  if (ambientWhisperTimer <= 0){
    ambientWhisperTimer = 12 + Math.random() * 28;
    playWhisper();
  }

  ambientVoiceTimer -= dt;
  if (ambientVoiceTimer <= 0){
    ambientVoiceTimer = 40 + Math.random() * 70;
    playVoice();
  }

  ambientScratchTimer -= dt;
  if (ambientScratchTimer <= 0){
    ambientScratchTimer = 16 + Math.random() * 32;
    playScratchCluster();
    if (Math.random() < 0.45){
      pendingScratches.push(0.8 + Math.random() * 1.5);
      if (Math.random() < 0.4){
        pendingScratches.push(1.8 + Math.random() * 2.2);
      }
    }
  }
  for (let i = pendingScratches.length - 1; i >= 0; i--){
    pendingScratches[i] -= dt;
    if (pendingScratches[i] <= 0){
      pendingScratches.splice(i, 1);
      playScratchCluster();
    }
  }
}

const clock = new THREE.Clock();

let shadowParity = 0;

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  uiFrame = (uiFrame + 1) % 3;

  shadowParity ^= 1;
  renderer.shadowMap.needsUpdate = (shadowParity === 0);

  const now = performance.now();
  if (clockRunning && bootDone && !won && !caughtActive && !falling) clockMs += Math.min(now - lastNow, 100);
  lastNow = now;
  clockEl.textContent = formatTime(clockMs);

  if (graceTimer > 0) graceTimer = Math.max(0, graceTimer - dt);

  if (bootDone && !won && !caughtActive) checkEpoch();

  updateAmbient(dt);

  if (falling){
    updateFall(dt);
    updateDust(dt);
    updateLamps(dt);
    updateMoveAudio();
    composer.render();
    if (uiFrame === 0) drawPanel(panel, dt * 3);
    drawMap();
    return;
  }

  if (won || caughtActive){
    updateDust(dt);
    updateGlitch(dt);
    applyViewGlitch();
    updateLamps(dt);
    updateMoveAudio();
    composer.render();
    if (uiFrame === 0) drawPanel(panel, dt * 3);
    drawMap();
    return;
  }

  const turning = input.left || input.right;
  if (input.left) rover.yaw += TURN_SPEED * dt;
  if (input.right) rover.yaw -= TURN_SPEED * dt;

  const fX = -Math.sin(rover.yaw), fZ = -Math.cos(rover.yaw);
  let dir = 0;
  if (input.forward) dir += 1;
  if (input.back) dir -= 1;
  const sp = dir > 0 ? MOVE_SPEED : BACK_SPEED;

  if (!collide(rover.x + fX * dir * sp * dt, rover.z)) rover.x += fX * dir * sp * dt;
  if (!collide(rover.x, rover.z + fZ * dir * sp * dt)) rover.z += fZ * dir * sp * dt;

  updateNoise(dt, dir !== 0, turning);

  if (dir !== 0){
    const checkX = rover.x + fX * dir * (ROVER_R + 0.25);
    const checkZ = rover.z + fZ * dir * (ROVER_R + 0.25);
    const cgx = Math.floor(checkX / CS), cgz = Math.floor(checkZ / CS);

    if (worldExit(cgx, cgz)){
      if (noclipT === 0) stats.noclipBumps++;
      noclipT += dt;
      if (noclipT > NOCLIP_TIME) triggerWin();
    } else {
      noclipT = Math.max(0, noclipT - dt * 2);
    }

    stepPhase += dt * 4.8;
    if (stepPhase >= 1){ stepPhase -= 1; sfxStep(); }
  } else {
    noclipT = Math.max(0, noclipT - dt * 2);
    stepPhase = 0;
  }

  if (overShaft(rover.x, rover.z)){
    startFall();
    return;
  }

  if (dir !== 0) bobPhase += dt * 9.5;
  const bob = dir !== 0 ? Math.sin(bobPhase) * 0.018 : 0;
  cam.position.set(rover.x, EYE_Y + bob, rover.z);
  cam.rotation.set(-0.06, rover.yaw, 0, 'YXZ');

  if (Math.random() < dt * 11) flickTarget = 4.2 + Math.random() * 1.2;
  if (lightsOn){
    frontLight.intensity += (flickTarget - frontLight.intensity) * Math.min(1, dt * 12);
    backLight.intensity += (flickTarget * 0.5 - backLight.intensity) * Math.min(1, dt * 12);
  } else {
    frontLight.intensity = backLight.intensity = 0;
  }

  frontLight.position.set(rover.x, EYE_Y, rover.z);
  frontTarget.position.set(rover.x + fX * 8, EYE_Y - 0.2, rover.z + fZ * 8);
  backLight.position.set(rover.x, EYE_Y, rover.z);
  backTarget.position.set(rover.x - fX * 6, EYE_Y - 0.2, rover.z - fZ * 6);

  updateMonsters(dt);
  updateDust(dt);
  updateLamps(dt);
  updateMoveAudio();

  if (graceTimer <= 0){
    for (const M of monsters){
      if (Math.hypot(M.x - rover.x, M.z - rover.z) < CAUGHT_DIST){ triggerCaught(); break; }
    }
  }

  updateGlitch(dt);
  applyViewGlitch();

  const clipP = Math.min(1, noclipT / NOCLIP_TIME);
  const targetExp = 1.02 + clipP * 0.5;
  exposure += (targetExp - exposure) * Math.min(1, dt * 8);
  renderer.toneMappingExposure = exposure;

  streamChunks();
  composer.render();
  if (uiFrame === 0) drawPanel(panel, dt * 3);
  drawMap();
}

tick();
</script>
