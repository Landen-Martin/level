<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>ROVER // LEVEL 0</title>
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font: 12px monospace;
    color: #c9b478;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #view {
    display: block;
    width: 72vmin; height: 72vmin;
    image-rendering: auto;
    background: #000;
    filter: blur(0.7px) contrast(1.08) saturate(0.92);
    transform: scale(1.03);
  }

  /* ═══════════════ ATMOSPHERE OVERLAYS ═══════════════ */
  #atmos {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 5;
    background:
      radial-gradient(ellipse at 50% 45%,
        rgba(60,40,15,0.10) 0%,
        rgba(0,0,0,0.0) 30%,
        rgba(0,0,0,0.55) 85%,
        rgba(0,0,0,0.92) 100%);
  }
  #scanlines {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 7;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.14) 2px,
      rgba(0,0,0,0.14) 3px
    );
    opacity: 0.55;
    mix-blend-mode: multiply;

  /* ═══════════════ SONAR ═══════════════ */
  .sonar {
    position: fixed;
    width: 160px; height: 160px;
    image-rendering: pixelated;
    background: #000;
    border: 1px solid rgba(255,255,255,0.15);

  #sonarS { right: 12px; top: 50%; transform: translateY(-50%); }

  /* ═══════════════ CHEAT MAP ═══════════════ */
  #map {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 94vmin; height: 94vmin;
    max-width: 900px; max-height: 900px;
    background: rgba(0,0,0,0.96);
    border: 2px solid rgba(110,255,160,0.5);
    box-shadow: 0 0 40px rgba(110,255,160,0.25), inset 0 0 30px rgba(0,0,0,0.9);
    z-index: 50;
    display: none;
    pointer-events: none;
    image-rendering: pixelated;
  }
  #map.on { display: block; }
  #mapLabel {
    position: fixed;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    color: #6effa0;
    font: 12px monospace;
    letter-spacing: 6px;
    z-index: 51;
    display: none;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(110,255,160,0.8);
  }
  #mapLabel.on { display: block; }

  /* ═══════════════ RED VIGNETTE ═══════════════ */
  #vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 6;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 30%,
      rgba(120,0,0,0.0) 45%,
      rgba(80,0,0,0.85) 100%);
    opacity: 0;
    transition: opacity 0.2s linear;
  }

  /* ═══════════════ CLOCK (bottom-left) ═══════════════ */
  #clock {
    position: fixed;
    bottom: 14px; left: 14px;
    z-index: 12;
    color: #7de8a0;
    font: 14px monospace;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(110,255,160,0.55);
    background: rgba(0,0,0,0.45);
    padding: 5px 11px;
    border: 1px solid rgba(110,255,160,0.25);
    pointer-events: none;
  }

  /* ═══════════════ D-PAD ═══════════════ */
  #ui {
    position: fixed;
    left: 22px; top: 50%;
    transform: translateY(-50%);
    width: 216px; height: 216px;
    z-index: 10;
  }
  #ui button {
    position: absolute;
    width: 66px; height: 66px;
    padding: 0;
    font: 11px monospace;
    color: #000;
    background: #fff;
    border: 1px solid #000;
    border-radius: 0;
    cursor: pointer;
    touch-action: none;
  }
  #ui button:active { background: #b8b8b8; color: #000; }
  #bF    { left: 75px;  top: 0; }
  #bL    { left: 0;     top: 75px; }
  #bLight{ left: 75px;  top: 75px; }
  #bR    { left: 150px; top: 75px; }
  #bB    { left: 75px;  top: 150px; }

  /* ═══════════════ BOOT ═══════════════ */
  #boot {
    position: fixed; inset: 0;
    background: #000; color: #fff;
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    font-family: monospace; font-size: 13px;
    transition: opacity 0.5s;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
  .bootInner { width: min(560px, 88vw); padding: 20px; }
  .bootHeader { color: #fff; margin-bottom: 14px; }
  .bootLog {
    height: 260px; overflow: hidden; line-height: 1.5;
    color: #fff; white-space: pre; margin-bottom: 14px;
  }
  .bootBarWrap { height: 10px; border: 1px solid #fff; margin-bottom: 6px; }
  .bootBarFill { height: 100%; width: 0%; background: #fff; transition: width 0.08s linear; }
  .bootPct { text-align: right; color: #fff; margin-bottom: 16px; }
  .bootEnter {
    display: block; margin: 0 auto;
    padding: 8px 28px;
    font: 13px monospace; letter-spacing: 3px;
    color: #000; background: #fff; border: 1px solid #fff;
    cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
  }
  .bootEnter.enabled { opacity: 1; pointer-events: auto; }

  /* ═══════════════ END SCREEN ═══════════════ */
  #end {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: #000;
    z-index: 500;
    pointer-events: none;
  }
  #end.on { display: flex; pointer-events: auto; }
  #end .box {

  #end h2 {

    animation: fadeIn 2.4s ease-out 1.6s both;

  #end button {

    animation: fadeIn 2.4s ease-out 3.2s both;

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ═══════════════ WIN SCREEN ═══════════════ */
  #win {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: #000;
    z-index: 200;
  }
  #win.on { display: flex; }
  #win .box {
    text-align: center;

    color: #fff;

    font-weight: normal;

  #win p {
    margin: 36px 0 0 0;

  }
  #win button {
    margin-top: 32px;
    padding: 10px 32px;
    font: 12px monospace;
    letter-spacing: 4px;
    color: #000;
    background: #fff;
    border: none;
    cursor: pointer;
    animation: fadeIn 2.4s ease-out 3.2s both;

</style>

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════ */
const CS = 3.0;
const WH = 3.0;
const CHUNK = 24;
const EYE_Y = 0.55;
const ROVER_R = 0.35;
const TURN_SPEED = 2.4;
const MOVE_SPEED = 2.2;
const BACK_SPEED = 1.4;
const NOCLIP_TIME = 0.9;
const RES = 360;

const MONSTER_COUNT = 12;
const MONSTER_SPEED = 1.25;
const MONSTER_LUNGE_SPEED = 3.15;
const CHASE_RANGE = 24;
const ALERT_RANGE = 34;

/* Sonar */
const SONAR_RANGE = 16;
const SONAR_RAYS = 48;
const SONAR_ARC = Math.PI * 0.9;
const SONAR_WAVE_SPEED = 9.0;

/* Threat proximity */
const MONSTER_GLITCH_RANGE = 12.0;
const WALL_GLITCH_RANGE = 10.0;

/* Safe zones — now common */
const SAFE_ZONE_COUNT = 30;
const SAFE_RADIUS = 4.6;
const SAFE_LIGHT_HEIGHT = 2.4;

/* Exits — now common */
const EXIT_COUNT = 40;

/* Caught */
const CAUGHT_DIST = 1.55;
const CAUGHT_COOLDOWN = 3.0;
const GRACE_AFTER_CAUGHT = 3.0;
const GRACE_AFTER_LOAD = 2.0;

/* Save */
const SAVE_KEY = 'rover_level0_save_v8';
const SAVE_INTERVAL_MS = 1000;

/* ══════════════════════════════════════════════════════════
   LOAD SAVE
   ══════════════════════════════════════════════════════════ */
let savedGame = null;
try { savedGame = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch(e){ savedGame = null; }
if (savedGame && typeof savedGame.seed !== 'number') savedGame = null;

const WORLD_SEED = (savedGame?.seed ?? (Math.random() * 0xFFFFFFF)) >>> 0;

/* ══════════════════════════════════════════════════════════
   HASH
   ══════════════════════════════════════════════════════════ */
function hash2(x, y){
  let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + WORLD_SEED) | 0;
  n = (n ^ (n >>> 13)) | 0;
  n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function n2(x, y){ return hash2(x * 8123 + 17, y * 9187 + 43); }

/* ══════════════════════════════════════════════════════════
   TERRAIN
   ══════════════════════════════════════════════════════════ */
function vWallOpen(i, j){
  return hash2(i * 31 + 11, j * 17 + 5) < 0.80;
}
function hWallOpen(i, j){
  return hash2(i * 53 + 7, j * 41 + 19) < 0.44;
}
function terrainIsWall(gx, gz){
  const mx = ((gx % 2) + 2) % 2;
  const mz = ((gz % 2) + 2) % 2;
  if (mx === 1 && mz === 1) return false;
  if (mx === 0 && mz === 0) return true;
  if (mx === 0) return !vWallOpen(gx / 2, (gz - 1) / 2);
  return !hWallOpen((gx - 1) / 2, gz / 2);
}

/* ══════════════════════════════════════════════════════════
   SAFE ZONE PALETTES
   ══════════════════════════════════════════════════════════ */
const SAFE_PALETTE = [
  { name: 'mint',   hex: 0x6effa0, css: '#6effa0', light: 0x9dffc0 },
  { name: 'red',    hex: 0xff3838, css: '#ff3838', light: 0xff7060 },
  { name: 'blue',   hex: 0x3a8aff, css: '#3a8aff', light: 0x6aaaff },
  { name: 'green',  hex: 0x40ff60, css: '#40ff60', light: 0x80ffa0 },
  { name: 'purple', hex: 0xb050ff, css: '#b050ff', light: 0xd080ff }
];
SAFE_PALETTE.forEach(p => {
  p.rgb = `${(p.hex >> 16) & 255}, ${(p.hex >> 8) & 255}, ${p.hex & 255}`;
});

function pickSafePalette(idx){
  const roll = hash2(idx * 977 + 3, 0x5AFE);
  if (roll < 0.5) return SAFE_PALETTE[0];
  const pick = hash2(idx * 977 + 4, 0xC0DE);
  return SAFE_PALETTE[1 + Math.floor(pick * 4)];
}

/* ══════════════════════════════════════════════════════════
   GENERATE SAFE ZONES (common)
   ══════════════════════════════════════════════════════════ */
const safeZones = [];
(function pickSafeZones(){
  let tries = 0;
  while (safeZones.length < SAFE_ZONE_COUNT && tries++ < 6000){
    const gx = 4 + Math.floor(hash2(tries * 11 + 5, 0x51) * 120);
    const gz = 4 + Math.floor(hash2(tries * 13 + 9, 0x52) * 120);
    if (terrainIsWall(gx, gz)) continue;

    /* Require a somewhat open pocket */
    let wallCount = 0;
    for (let dx = -2; dx <= 2; dx++){
      for (let dz = -2; dz <= 2; dz++){
        if (terrainIsWall(gx + dx, gz + dz)) wallCount++;
      }
    }
    if (wallCount > 9) continue;

    /* Not too close to another safe zone (tighter since they're common) */
    let tooClose = false;
    for (const z of safeZones){
      if (Math.hypot(z.gx - gx, z.gz - gz) < 6) { tooClose = true; break; }
    }
    if (tooClose) continue;

    safeZones.push({
      gx, gz,
      x: gx * CS + CS/2,
      z: gz * CS + CS/2,
      index: safeZones.length
    });
  }
})();

/* ══════════════════════════════════════════════════════════
   GENERATE EXIT POINTS (common, scattered)
   ══════════════════════════════════════════════════════════ */
const exitWalls = [];
const exitWallSet = new Set();

(function pickExits(){
  let tries = 0;
  while (exitWalls.length < EXIT_COUNT && tries++ < 12000){
    const gx = 4 + Math.floor(hash2(tries * 17 + 3, 0xA11) * 120);
    const gz = 4 + Math.floor(hash2(tries * 23 + 7, 0xB22) * 120);

    const mx = ((gx % 2) + 2) % 2;
    const mz = ((gz % 2) + 2) % 2;
    if (mx === 1 && mz === 1) continue;

    if (Math.abs(gx - 1) < 5 && Math.abs(gz - 1) < 5) continue;

    const key = gx + ',' + gz;
    if (exitWallSet.has(key)) continue;

    /* Not too close to another exit (tighter since they're common) */
    let tooClose = false;
    for (const e of exitWalls){
      if (Math.hypot(e.gx - gx, e.gz - gz) < 4){ tooClose = true; break; }
    }
    if (tooClose) continue;

    /* Not inside a safe zone center */
    let inSafe = false;
    for (const z of safeZones){
      if (Math.hypot(z.gx - gx, z.gz - gz) < 3){ inSafe = true; break; }
    }
    if (inSafe) continue;

    exitWalls.push({ gx, gz });
    exitWallSet.add(key);
  }
})();

/* ══════════════════════════════════════════════════════════
   WALL QUERY
   ══════════════════════════════════════════════════════════ */
function isWall(gx, gz){
  if (exitWallSet.has(gx + ',' + gz)) return true;
  return terrainIsWall(gx, gz);
}
function isExitWall(gx, gz){ return exitWallSet.has(gx + ',' + gz); }

const chunkData = new Map();
function getChunkData(cx, cz){
  const key = cx + ',' + cz;
  let d = chunkData.get(key);
  if (d) return d;
  const solid = new Uint8Array(CHUNK * CHUNK);
  for (let lz = 0; lz < CHUNK; lz++){
    for (let lx = 0; lx < CHUNK; lx++){
      const gx = cx * CHUNK + lx;
      const gz = cz * CHUNK + lz;
      solid[lz * CHUNK + lx] = isWall(gx, gz) ? 1 : 0;
    }
  }
  d = { solid };
  chunkData.set(key, d);
  return d;
}
function worldSolid(gx, gz){
  const cx = Math.floor(gx / CHUNK);
  const cz = Math.floor(gz / CHUNK);
  const lx = gx - cx * CHUNK;
  const lz = gz - cz * CHUNK;
  return getChunkData(cx, cz).solid[lz * CHUNK + lx] === 1;
}

/* ══════════════════════════════════════════════════════════
   TEXTURES
   ══════════════════════════════════════════════════════════ */
function makeTex(S, fill){
  const d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const c = fill(x / S, y / S);
      const i = (y * S + x) * 4;
      d[i]   = Math.max(0, Math.min(255, c[0]));
      d[i+1] = Math.max(0, Math.min(255, c[1]));
      d[i+2] = Math.max(0, Math.min(255, c[2]));
      d[i+3] = 255;
    }
  }
  const t = new THREE.DataTexture(d, S, S, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  t.colorSpace = THREE.SRGBColorSpace;
  t.needsUpdate = true;
  return t;
}

const wallTex = makeTex(128, (u, v) => {
  if (v < 0.06) return [58, 42, 24];
  if (v > 0.94) return [148, 130, 88];
  const n = (n2(Math.floor(u * 128), Math.floor(v * 128)) - 0.5) * 16;
  const fine = (n2(Math.floor(u * 256), Math.floor(v * 256)) - 0.5) * 6;
  const seam = (u * 4) % 1 < 0.018 ? -26 : 0;
  const stain = Math.max(0, n2(Math.floor(u * 8), Math.floor(v * 8)) - 0.75) * -40;
  return [128 + n + fine + seam + stain,
          112 + n + fine + seam + stain,
          72 + n * 0.7 + fine * 0.7 + seam + stain];
});
const exitWallTex = wallTex.clone();
exitWallTex.offset.set(0.085, 0.0);
exitWallTex.needsUpdate = true;

const floorTex = makeTex(128, (u, v) => {
  const n = (n2(Math.floor(u * 256), Math.floor(v * 256)) - 0.5) * 26;
  const fine = (n2(Math.floor(u * 512), Math.floor(v * 512)) - 0.5) * 8;
  const crack = Math.abs(n2(Math.floor(u * 12), Math.floor(v * 12)) - 0.5) < 0.02 ? -30 : 0;
  return [72 + n + fine + crack, 60 + n + fine + crack, 38 + n + fine + crack];
});
const ceilTex = makeTex(128, (u, v) => {
  const gx = (u * 128) % 32, gy = (v * 128) % 32;
  if (gx < 2 || gy < 2) return [58, 56, 50];
  const n = (n2(Math.floor(u * 128), Math.floor(v * 128)) - 0.5) * 12;
  const fine = (n2(Math.floor(u * 256), Math.floor(v * 256)) - 0.5) * 5;
  return [130 + n + fine, 126 + n + fine, 112 + n + fine];
});

/* ══════════════════════════════════════════════════════════
   SCENE
   ══════════════════════════════════════════════════════════ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030202);
scene.fog = new THREE.FogExp2(0x030202, 0.092);

const cam = new THREE.PerspectiveCamera(84, 1, 0.05, 50);
cam.rotation.order = 'YXZ';

const viewEl = document.getElementById('view');

const renderer = new THREE.WebGLRenderer({
  canvas: viewEl, antialias: true,
  powerPreference: 'high-performance', stencil: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(RES, RES, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

/* ══════════════════════════════════════════════════════════
   MATERIALS / GEO
   ══════════════════════════════════════════════════════════ */
floorTex.repeat.set(CHUNK, CHUNK);
ceilTex.repeat.set(CHUNK, CHUNK);

const wallMat     = new THREE.MeshLambertMaterial({ map: wallTex });
const exitWallMat = new THREE.MeshLambertMaterial({ map: exitWallTex });
const floorMat    = new THREE.MeshLambertMaterial({ map: floorTex });
const ceilMat     = new THREE.MeshLambertMaterial({ map: ceilTex });

const wallGeo  = new THREE.BoxGeometry(CS, WH, CS);
const floorGeo = new THREE.PlaneGeometry(CHUNK * CS, CHUNK * CS); floorGeo.rotateX(-Math.PI / 2);
const ceilGeo  = new THREE.PlaneGeometry(CHUNK * CS, CHUNK * CS); ceilGeo.rotateX( Math.PI / 2);

/* ══════════════════════════════════════════════════════════
   CHUNKS
   ══════════════════════════════════════════════════════════ */
const chunkMeshes = new Map();

function buildChunk(cx, cz){
  const key = cx + ',' + cz;
  if (chunkMeshes.has(key)) return;
  const data = getChunkData(cx, cz);
  const group = new THREE.Group();
  const ox = cx * CHUNK * CS;
  const oz = cz * CHUNK * CS;

  const solidList = [];
  for (let lz = 0; lz < CHUNK; lz++){
    for (let lx = 0; lx < CHUNK; lx++){
      if (!data.solid[lz * CHUNK + lx]) continue;
      const gx = cx * CHUNK + lx;
      const gz = cz * CHUNK + lz;
      if (isExitWall(gx, gz)) continue;
      solidList.push([lx, lz]);
    }
  }
  if (solidList.length){
    const mesh = new THREE.InstancedMesh(wallGeo, wallMat, solidList.length);
    const m = new THREE.Matrix4();
    for (let i = 0; i < solidList.length; i++){
      const [lx, lz] = solidList[i];
      m.makeTranslation(ox + lx * CS + CS/2, WH/2, oz + lz * CS + CS/2);
      mesh.setMatrixAt(i, m);
    }
    mesh.instanceMatrix.needsUpdate = true;
    group.add(mesh);
  }

  for (const e of exitWalls){
    const ecx = Math.floor(e.gx / CHUNK);
    const ecz = Math.floor(e.gz / CHUNK);
    if (ecx !== cx || ecz !== cz) continue;
    const lx = e.gx - cx * CHUNK;
    const lz = e.gz - cz * CHUNK;
    const em = new THREE.Mesh(wallGeo, exitWallMat);
    em.position.set(ox + lx * CS + CS/2, WH/2, oz + lz * CS + CS/2);
    group.add(em);
  }

  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.position.set(ox + CHUNK * CS/2, 0, oz + CHUNK * CS/2);
  group.add(floor);

  const ceil = new THREE.Mesh(ceilGeo, ceilMat);
  ceil.position.set(ox + CHUNK * CS/2, WH, oz + CHUNK * CS/2);
  group.add(ceil);

  scene.add(group);
  chunkMeshes.set(key, group);
}
function disposeChunk(cx, cz){
  const key = cx + ',' + cz;
  const g = chunkMeshes.get(key);
  if (!g) return;
  scene.remove(g);
  chunkMeshes.delete(key);
}

function inSafeZone(x, z){
  for (const zone of safeZones){
    const dx = x - zone.x, dz = z - zone.z;
    if (dx*dx + dz*dz < SAFE_RADIUS * SAFE_RADIUS) return zone;
  }
  return null;
}

const DUST_COUNT = 260;

function makeDustSprite(){
  const s = 32;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0,    'rgba(255,238,200,1)');
  g.addColorStop(0.35, 'rgba(255,230,180,0.45)');
  g.addColorStop(1,    'rgba(255,220,160,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_COUNT * 3);
const dustVel = new Float32Array(DUST_COUNT * 3);
const dustPhase = new Float32Array(DUST_COUNT);

for (let i = 0; i < DUST_COUNT; i++){
  const i3 = i * 3;
  dustPos[i3+0] = (Math.random() - 0.5) * DUST_BOX.x;
  dustPos[i3+1] = Math.random() * DUST_BOX.y + 0.15;
  dustPos[i3+2] = (Math.random() - 0.5) * DUST_BOX.z;
  dustVel[i3+0] = (Math.random() - 0.5) * 0.09;
  dustVel[i3+1] = -0.02 - Math.random() * 0.05;
  dustVel[i3+2] = (Math.random() - 0.5) * 0.09;
  dustPhase[i] = Math.random() * Math.PI * 2;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));

const dustMat = new THREE.PointsMaterial({
  size: 0.075,
  map: makeDustSprite(),
  transparent: true,
  opacity: 0.32,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  color: 0xffe0a0,
  sizeAttenuation: true
});
const dustPoints = new THREE.Points(dustGeo, dustMat);
dustPoints.frustumCulled = false;
scene.add(dustPoints);

function updateDust(dt){
  const pos = dustGeo.attributes.position.array;
  const time = performance.now() * 0.001;
  const rx = rover.x, rz = rover.z;
  const halfX = DUST_BOX.x / 2, halfZ = DUST_BOX.z / 2;

  for (let i = 0; i < DUST_COUNT; i++){
    const i3 = i * 3;
    const ph = dustPhase[i];

    pos[i3+0] += dustVel[i3+0] * dt + Math.sin(time + ph) * 0.0035;
    pos[i3+1] += dustVel[i3+1] * dt;
    pos[i3+2] += dustVel[i3+2] * dt + Math.cos(time * 0.8 + ph) * 0.0035;

    if (pos[i3+1] < 0.1) pos[i3+1] = DUST_BOX.y;

    if (pos[i3+0] - rx < -halfX) pos[i3+0] = rx + halfX;
    else if (pos[i3+0] - rx > halfX) pos[i3+0] = rx - halfX;
    if (pos[i3+2] - rz < -halfZ) pos[i3+2] = rz + halfZ;
    else if (pos[i3+2] - rz > halfZ) pos[i3+2] = rz - halfZ;
  }
  dustGeo.attributes.position.needsUpdate = true;
}

/* ══════════════════════════════════════════════════════════
   COLLISION
   ══════════════════════════════════════════════════════════ */
function collide(x, z){
  const r = ROVER_R;
  const x0 = Math.floor((x - r) / CS), x1 = Math.floor((x + r) / CS);
  const z0 = Math.floor((z - r) / CS), z1 = Math.floor((z + r) / CS);
  for (let gz = z0; gz <= z1; gz++){
    for (let gx = x0; gx <= x1; gx++){
      if (!worldSolid(gx, gz)) continue;
      const ax = gx * CS, az = gz * CS;
      const cx = Math.max(ax, Math.min(x, ax + CS));
      const cz = Math.max(az, Math.min(z, az + CS));
      const dx = x - cx, dz = z - cz;
      if (dx * dx + dz * dz < r * r) return true;
    }
  }
  return false;
}

function spawnMonster(){
  let tries = 0;
  while (tries++ < 500){
    const gx = Math.floor(rover.x / CS) + ((Math.random() * 80) | 0) - 40;
    const gz = Math.floor(rover.z / CS) + ((Math.random() * 80) | 0) - 40;
    if (worldSolid(gx, gz)) continue;
    const wx = gx * CS + CS/2, wz = gz * CS + CS/2;
    if (inSafeZone(wx, wz)) continue;
    const dx = wx - rover.x, dz = wz - rover.z;
    if (dx * dx + dz * dz < 400) continue;
    return { x: wx, z: wz };
  }
  return { x: rover.x + 60, z: rover.z + 60 };
}

for (let i = 0; i < MONSTER_COUNT; i++){
  const p = spawnMonster();
  monsters.push({
    x: p.x, z: p.z,
    yaw: Math.random() * Math.PI * 2,
    wanderTimer: Math.random() * 3,
    mesh: makeMonsterMesh(),
    phase: Math.random() * Math.PI * 2,
    lunge: 0
  });
}

let globalFlash = 0;

function updateMonsters(dt){
  const safe = inSafeZone(rover.x, rover.z);
  const playerMoving = input.forward || input.back || input.left || input.right;
  const hearRange = playerMoving ? ALERT_RANGE : CHASE_RANGE;

  for (const M of monsters){
    M.wanderTimer -= dt;
    if (M.wanderTimer <= 0){
      M.wanderTimer = 1.0 + Math.random() * 1.8;
      M.yaw += (Math.random() - 0.5) * 2.6;
    }

    const dxP = rover.x - M.x, dzP = rover.z - M.z;
    const dP = Math.hypot(dxP, dzP);

    if (dP < hearRange && !safe){
      const want = Math.atan2(dxP, dzP);
      let diff = want - M.yaw;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      const turnSpeed = 2.5 + (1 - Math.min(1, dP / hearRange)) * 4.0;
      M.yaw += diff * Math.min(1, dt * turnSpeed);
    } else if (dP < 6 && safe){
      const want = Math.atan2(dxP, dzP);
      let diff = want - M.yaw;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      M.yaw += diff * Math.min(1, dt * 1.8);
    }

    const wantLunge = (!safe && dP < 6.5) ? 1 : 0;
    M.lunge += (wantLunge - M.lunge) * Math.min(1, dt * 4.5);

    const speed = MONSTER_SPEED + M.lunge * (MONSTER_LUNGE_SPEED - MONSTER_SPEED);
    const fX = Math.sin(M.yaw);
    const fZ = Math.cos(M.yaw);
    const nx = M.x + fX * speed * dt;
    const nz = M.z + fZ * speed * dt;
    if (!collide(nx, M.z)) M.x = nx; else M.yaw += 2.4 * dt;
    if (!collide(M.x, nz)) M.z = nz; else M.yaw -= 2.4 * dt;

    for (const zone of safeZones){
      const dx = M.x - zone.x, dz = M.z - zone.z;
      const d = Math.hypot(dx, dz);
      const pushR = SAFE_RADIUS + 0.5;
      if (d < pushR && d > 0.01){
        const push = (pushR - d) * 5 * dt;
        M.x += (dx / d) * push;
        M.z += (dz / d) * push;
      }
    }

    const t = performance.now() * 0.003 + M.phase;
    M.mesh.position.set(M.x, Math.abs(Math.sin(t * 6)) * 0.05, M.z);
    M.mesh.rotation.y = M.yaw;
  }
}

/* ══════════════════════════════════════════════════════════
   STREAMING
   ══════════════════════════════════════════════════════════ */
let lastCX = 9999, lastCZ = 9999;
function streamChunks(){
  const ccx = Math.floor(rover.x / (CHUNK * CS));
  const ccz = Math.floor(rover.z / (CHUNK * CS));
  if (ccx === lastCX && ccz === lastCZ) return;
  lastCX = ccx; lastCZ = ccz;
  const wanted = new Set();
  for (let dz = -1; dz <= 1; dz++){
    for (let dx = -1; dx <= 1; dx++){
      const cx = ccx + dx, cz = ccz + dz;
      const key = cx + ',' + cz;
      wanted.add(key);
      if (!chunkMeshes.has(key)) buildChunk(cx, cz);
    }
  }
  for (const key of Array.from(chunkMeshes.keys())){
    if (!wanted.has(key)){
      const p = key.split(',');
      disposeChunk(+p[0], +p[1]);
    }
  }
}

/* ══════════════════════════════════════════════════════════
   SONAR
   ══════════════════════════════════════════════════════════ */
const sonarSCv  = document.getElementById('sonarS');
const sonarSCtx = sonarSCv.getContext('2d');
const SW = sonarSCv.width, SH = sonarSCv.height;

const HIT_WALL = 1, HIT_EXIT = 2, HIT_MONSTER = 3, HIT_SAFE = 4;

let sonarGlitch = 0;
let glitchAmt = 0;

const panel = { ctx: sonarSCtx, dir: Math.PI, waveR: 0, hits: [] };

function castSonar(dirOffset){
  const base = rover.yaw + dirOffset;
  const startAng = base - SONAR_ARC / 2;
  const N = SONAR_RAYS;
  const rayDist = new Float32Array(N + 1);
  const rayType = new Uint8Array(N + 1);
  const rayColor = new Array(N + 1).fill(null);

  for (let i = 0; i <= N; i++){
    const a = startAng + (i / N) * SONAR_ARC;
    const dx = -Math.sin(a);
    const dz = -Math.cos(a);
    let dist = 0;
    rayDist[i] = SONAR_RANGE;
    const step = 0.22;
    while (dist < SONAR_RANGE){
      dist += step;
      const px = rover.x + dx * dist;
      const pz = rover.z + dz * dist;
      const gx = Math.floor(px / CS);
      const gz = Math.floor(pz / CS);
      if (worldSolid(gx, gz)){
        rayDist[i] = dist;
        rayType[i] = isExitWall(gx, gz) ? HIT_EXIT : HIT_WALL;
        break;
      }
    }
  }

  for (const M of monsters){
    const dx = M.x - rover.x, dz = M.z - rover.z;
    const d = Math.hypot(dx, dz);
    if (d >= SONAR_RANGE) continue;
    const a = Math.atan2(-dx, -dz);
    let rel = a - base;
    while (rel >  Math.PI) rel -= Math.PI * 2;
    while (rel < -Math.PI) rel += Math.PI * 2;
    if (Math.abs(rel) > SONAR_ARC / 2) continue;
    const idx = Math.round(((rel + SONAR_ARC / 2) / SONAR_ARC) * N);
    if (idx < 0 || idx > N) continue;
    if (d < rayDist[idx]){ rayDist[idx] = d; rayType[idx] = HIT_MONSTER; }
  }

  for (const zone of safeZones){
    const dx = zone.x - rover.x, dz = zone.z - rover.z;
    const d = Math.hypot(dx, dz);
    if (d >= SONAR_RANGE) continue;
    const a = Math.atan2(-dx, -dz);
    let rel = a - base;
    while (rel >  Math.PI) rel -= Math.PI * 2;
    while (rel < -Math.PI) rel += Math.PI * 2;
    if (Math.abs(rel) > SONAR_ARC / 2) continue;
    const idx = Math.round(((rel + SONAR_ARC / 2) / SONAR_ARC) * N);
    if (idx < 0 || idx > N) continue;
    if (d < rayDist[idx]){
      rayDist[idx] = d;
      rayType[idx] = HIT_SAFE;
      rayColor[idx] = zone.palette.rgb;
    }
  }

  const hits = [];
  for (let i = 0; i <= N; i++){
    if (rayType[i] === 0) continue;
    hits.push({
      dist: rayDist[i],
      ang: startAng + (i / N) * SONAR_ARC,
      type: rayType[i],
      color: rayColor[i]
    });
  }
  return hits;
}

function drawGlitchOn(ctx){
  if (sonarGlitch < 0.05) return;
  const bars = Math.floor(1 + sonarGlitch * 5);
  for (let i = 0; i < bars; i++){
    const y = Math.random() * SH | 0;
    const bh = 1 + (Math.random() * 3 | 0);
    ctx.fillStyle = `rgba(255,255,255,${0.10 + Math.random() * 0.22})`;
    ctx.fillRect(0, y, SW, bh);
  }
  const specks = Math.floor(50 * sonarGlitch);
  for (let i = 0; i < specks; i++){
    ctx.fillStyle = Math.random() < 0.5 ? '#fff' : '#000';
    ctx.fillRect(Math.random() * SW | 0, Math.random() * SH | 0, 1, 1);
  }
}

function drawPanel(P, dt){
  const ctx = P.ctx;
  const cx = SW / 2, cy = SH / 2;
  const maxR = SW * 0.44;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SW, SH);

  P.waveR += dt * SONAR_WAVE_SPEED;
  if (P.waveR > SONAR_RANGE) P.waveR = 0;
  P.hits = castSonar(P.dir);

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++){
    ctx.beginPath();
    ctx.arc(cx, cy, (maxR / 3) * i, 0, Math.PI * 2);
    ctx.stroke();
  }

  const a0 = -Math.PI / 2 - SONAR_ARC / 2;
  const a1 = -Math.PI / 2 + SONAR_ARC / 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(a0) * maxR, cy + Math.sin(a0) * maxR);
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(a1) * maxR, cy + Math.sin(a1) * maxR);
  ctx.stroke();

  const wavePx = (P.waveR / SONAR_RANGE) * maxR;
  const waveAlpha = 1 - P.waveR / SONAR_RANGE;
  ctx.strokeStyle = `rgba(255,255,255,${0.75 * waveAlpha})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, wavePx, a0, a1);
  ctx.stroke();

  const panelYaw = rover.yaw + P.dir;
  for (const h of P.hits){
    const age = P.waveR - h.dist;
    if (age < 0) continue;
    const fade = Math.max(0.12, 1 - age / 3);
    const r = (h.dist / SONAR_RANGE) * maxR;
    const rel = h.ang - panelYaw;
    const sx = cx - Math.sin(rel) * r;
    const sy = cy - Math.cos(rel) * r;

    let col;
    if (h.type === HIT_MONSTER)      col = '255, 30, 24';
    else if (h.type === HIT_EXIT)    col = '48, 255, 110';
    else if (h.type === HIT_SAFE)    col = h.color || '110, 255, 160';
    else                             col = '255,255,255';

    const jx = sonarGlitch > 0.3 ? (Math.random() - 0.5) * sonarGlitch * 2 : 0;
    const jy = sonarGlitch > 0.3 ? (Math.random() - 0.5) * sonarGlitch * 2 : 0;

    ctx.fillStyle = `rgba(${col},${fade})`;
    if (h.type === HIT_WALL) ctx.fillRect(sx + jx - 1, sy + jy - 1, 2, 2);
    else                     ctx.fillRect(sx + jx - 1.5, sy + jy - 1.5, 3, 3);
  }

  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - 1, cy - 1, 2, 2);

  drawGlitchOn(ctx);
}

function formatTime(ms){
  const total = Math.max(0, Math.floor(ms));
  const h = Math.floor(total / 3600000);
  const m = Math.floor((total % 3600000) / 60000);
  const s = Math.floor((total % 60000) / 1000);
  const n = total % 1000;
  return String(h).padStart(2, '0') + ':' +
         String(m).padStart(2, '0') + ':' +
         String(s).padStart(2, '0') + '.' +
         String(n).padStart(3, '0');
}

    playtimeMs: clockMs,
    timesCaught: stats.timesCaught,
    noclipBumps: stats.noclipBumps,
    safeZonesVisited: Array.from(stats.safeZonesVisited),
    lightsOn: lightsOn,
    won: won
  };
}

function saveGame(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(collectSave())); }
  catch(e){}
}

setInterval(() => {
  if (bootDone && !won && !caughtActive) saveGame();
}, SAVE_INTERVAL_MS);

/* ══════════════════════════════════════════════════════════
   CAUGHT — "THE END" (no jumpscare)
   ══════════════════════════════════════════════════════════ */
const endEl = document.getElementById('end');
let caughtActive = false;
let caughtTimer = 0;
const CAUGHT_HOLD = 4.5;   // seconds before returning to play
let graceTimer = savedGame ? GRACE_AFTER_LOAD : 0;

/* Reset animations when showing end screen */
function showEndScreen(){
  const box = endEl.querySelector('.box');
  /* Force reflow to restart CSS animations */
  box.style.animation = 'none';
  void box.offsetWidth;
  box.style.animation = '';
  endEl.classList.add('on');
}

function triggerCaught(){
  if (caughtActive || graceTimer > 0) return;
  caughtActive = true;
  caughtTimer = 0;
  stats.timesCaught++;
  showEndScreen();
  saveGame();
}

function updateCaught(dt){
  if (graceTimer > 0) graceTimer -= dt;
  if (!caughtActive) return;

  caughtTimer += dt;
  if (caughtTimer >= CAUGHT_HOLD){
    caughtActive = false;
    endEl.classList.remove('on');

    /* Teleport rover to nearest safe zone */
    let bestZone = safeZones[0];
    let bestDist = Infinity;
    for (const z of safeZones){
      const d = Math.hypot(z.x - rover.x, z.z - rover.z);
      if (d < bestDist){ bestDist = d; bestZone = z; }
    }
    if (bestZone){
      rover.x = bestZone.x;
      rover.z = bestZone.z;
      stats.safeZonesVisited.add(bestZone.index);
    }

    /* Push monsters away */
    for (const M of monsters){
      const ang = Math.random() * Math.PI * 2;
      M.x = rover.x + Math.cos(ang) * 30;
      M.z = rover.z + Math.sin(ang) * 30;
      M.lunge = 0;
      M.wanderTimer = 1;
    }

    graceTimer = GRACE_AFTER_CAUGHT;
    saveGame();
  }
}

/* ══════════════════════════════════════════════════════════
   GLITCH / PROXIMITY
   ══════════════════════════════════════════════════════════ */
const vignetteEl = document.getElementById('vignette');
let heartbeatTimer = 0;

function updateGlitch(dt){
  let mProx = 0;
  for (const M of monsters){
    const d = Math.hypot(M.x - rover.x, M.z - rover.z);
    if (d < MONSTER_GLITCH_RANGE){
      const p = 1 - d / MONSTER_GLITCH_RANGE;
      if (p > mProx) mProx = p;
    }
  }

  let wProx = 0;
  for (const e of exitWalls){
    const ex = e.gx * CS + CS / 2;
    const ez = e.gz * CS + CS / 2;
    const dW = Math.hypot(ex - rover.x, ez - rover.z);
    if (dW < WALL_GLITCH_RANGE){
      const p = 1 - dW / WALL_GLITCH_RANGE;
      if (p > wProx) wProx = p;
    }
  }

  const safe = inSafeZone(rover.x, rover.z);
  const effProx = safe ? Math.min(mProx, 0.15) : mProx;

  const target = Math.max(effProx, wProx);
  glitchAmt += (target - glitchAmt) * Math.min(1, dt * 6);

  const clip = Math.min(1, noclipT / NOCLIP_TIME);
  sonarGlitch = Math.max(glitchAmt, clip * 0.9, globalFlash * 1.2);
  if (sonarGlitch < 0.02) sonarGlitch = 0;

  vignetteEl.style.opacity = (effProx * 0.9).toFixed(3);

  if (!safe && effProx > 0.15){
    heartbeatTimer -= dt;
    if (heartbeatTimer <= 0){
      playHeartbeat(effProx);
      heartbeatTimer = 0.7 - effProx * 0.4;
    }
  } else {
    heartbeatTimer = 0.3;
  }
}

let viewDistorted = false;
function applyViewGlitch(){
  if (sonarGlitch > 0.02){
    const j = sonarGlitch * 7;
    const tx = (Math.random() - 0.5) * j;
    const ty = (Math.random() - 0.5) * j;
    viewEl.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(1.03)`;
    viewEl.style.filter =
      `blur(${(0.7 + sonarGlitch * 3.0).toFixed(2)}px) ` +
      `contrast(${(1.08 + sonarGlitch * 0.55).toFixed(2)}) ` +
      `saturate(${(0.92 - sonarGlitch * 0.5).toFixed(2)})`;
    viewDistorted = true;
  } else if (viewDistorted){
    viewEl.style.transform = '';
    viewEl.style.filter = 'blur(0.7px) contrast(1.08) saturate(0.92)';
    viewDistorted = false;
  }
}

function updateSonar(dt){
  updateGlitch(dt);
  drawPanel(panel, dt);
}

/* ══════════════════════════════════════════════════════════
   CHEAT MAP  (D + E + V)
   ══════════════════════════════════════════════════════════ */
const mapEl      = document.getElementById('map');
const mapCtx     = mapEl.getContext('2d');
const mapLabelEl = document.getElementById('mapLabel');
const MAP_SIZE   = mapEl.width;
const MAP_RADIUS = 26;
const MAP_PX     = MAP_SIZE / (MAP_RADIUS * 2);

let mapActive = false;
const keysDown = new Set();
const COMBO = ['d', 'e', 'v'];
let cheatArmed = true;

addEventListener('keydown', e => {
  keysDown.add(e.key.toLowerCase());
  const allDown = COMBO.every(k => keysDown.has(k));
  if (allDown && cheatArmed){
    mapActive = !mapActive;
    mapEl.classList.toggle('on', mapActive);
    mapLabelEl.classList.toggle('on', mapActive);
    cheatArmed = false;
    startAudio();
  }
});
addEventListener('keyup', e => {
  keysDown.delete(e.key.toLowerCase());
  if (!COMBO.every(k => keysDown.has(k))) cheatArmed = true;
});

function drawMap(){
  if (!mapActive) return;
  const ctx = mapCtx;
  const S = MAP_SIZE;
  const rgx = Math.floor(rover.x / CS);
  const rgz = Math.floor(rover.z / CS);

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, S, S);

  for (let dz = -MAP_RADIUS; dz < MAP_RADIUS; dz++){
    for (let dx = -MAP_RADIUS; dx < MAP_RADIUS; dx++){
      const gx = rgx + dx;
      const gz = rgz + dz;
      const sx = (dx + MAP_RADIUS) * MAP_PX;
      const sz = (dz + MAP_RADIUS) * MAP_PX;

      let col;
      if (isExitWall(gx, gz)) col = '#2aff6e';
      else if (worldSolid(gx, gz)) col = '#6b5730';
      else col = '#0d0c08';

      let safeHere = false;
      for (const zone of safeZones){
        const ddx = (gx * CS + CS/2) - zone.x;
        const ddz = (gz * CS + CS/2) - zone.z;
        if (ddx*ddx + ddz*ddz < SAFE_RADIUS * SAFE_RADIUS){
          safeHere = true; break;
        }
      }
      if (safeHere && !worldSolid(gx, gz)) col = '#172e1e';

      ctx.fillStyle = col;
      ctx.fillRect(sx, sz, MAP_PX + 0.6, MAP_PX + 0.6);
    }
  }

  for (const zone of safeZones){
    const dx = (zone.x / CS) - rgx;
    const dz = (zone.z / CS) - rgz;
    if (Math.abs(dx) > MAP_RADIUS || Math.abs(dz) > MAP_RADIUS) continue;
    const sx = (dx + MAP_RADIUS) * MAP_PX;
    const sz = (dz + MAP_RADIUS) * MAP_PX;
    ctx.strokeStyle = zone.palette.css;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, sz, (SAFE_RADIUS / CS) * MAP_PX, 0, Math.PI * 2);
    ctx.stroke();
  }

  for (const M of monsters){
    const dx = (M.x / CS) - rgx;
    const dz = (M.z / CS) - rgz;
    if (Math.abs(dx) > MAP_RADIUS || Math.abs(dz) > MAP_RADIUS) continue;
    const sx = (dx + MAP_RADIUS) * MAP_PX;
    const sz = (dz + MAP_RADIUS) * MAP_PX;
    ctx.fillStyle = '#ff3020';
    ctx.fillRect(sx - 3, sz - 3, 6, 6);
    ctx.fillStyle = 'rgba(255,48,32,0.4)';
    ctx.fillRect(sx - 6, sz - 6, 12, 12);
  }

  const cx = MAP_RADIUS * MAP_PX;
  const cz = MAP_RADIUS * MAP_PX;
  const dirX = -Math.sin(rover.yaw);
  const dirZ = -Math.cos(rover.yaw);

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cz);
  ctx.lineTo(cx + dirX * 22, cz + dirZ * 22);
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(cx - 3, cz - 3, 6, 6);

  ctx.strokeStyle = 'rgba(110,255,160,0.12)';
  ctx.lineWidth = 1;
  for (let i = -MAP_RADIUS; i <= MAP_RADIUS; i += 5){
    const p = (i + MAP_RADIUS) * MAP_PX;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(S, p); ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(110,255,160,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, S - 2, S - 2);
}

/* ══════════════════════════════════════════════════════════
   AUDIO
   ══════════════════════════════════════════════════════════ */
let actx = null, droneGain = null;
function startAudio(){
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  const master = actx.createGain();
  master.gain.value = 0.4;
  master.connect(actx.destination);

  droneGain = actx.createGain();
  droneGain.gain.value = 0.10;
  droneGain.connect(master);

  [42, 63, 126].forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = i < 2 ? 'sawtooth' : 'sine';
    o.frequency.value = f;
    const g = actx.createGain();
    g.gain.value = i === 2 ? 0.12 : 0.30;
    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 240;
    o.connect(g); g.connect(lp); lp.connect(droneGain);
    o.start();
  });
}

function playHeartbeat(vol){
  if (!actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(65, t0);
  osc.frequency.exponentialRampToValueAtTime(30, t0 + 0.16);
  const g = actx.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(0.35 * vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0 + 0.28);
}

/* Low soft "you were taken" tone when caught */
function playCaughtTone(){
  if (!actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, t0);
  osc.frequency.exponentialRampToValueAtTime(55, t0 + 2.4);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.22, t0 + 0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.6);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0 + 2.7);
}

/* Rising chime when winning */
function playWinTone(){
  if (!actx) return;
  const t0 = actx.currentTime;
  [261.63, 329.63, 392.00, 523.25].forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const g = actx.createGain();
    const start = t0 + i * 0.22;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.20, start + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 1.6);
    o.connect(g); g.connect(actx.destination);
    o.start(start); o.stop(start + 1.7);
  });
}

/* ══════════════════════════════════════════════════════════
   BOOT SCREEN
   ══════════════════════════════════════════════════════════ */
const bootEl    = document.getElementById('boot');
const bootLog   = document.getElementById('bootLog');
const bootFill  = document.getElementById('bootFill');
const bootPct   = document.getElementById('bootPct');
const bootEnter = document.getElementById('bootEnter');

const BOOT_LINES = [
  { at: 0,   text: '> ROVER OS v0.8.0' },
  { at: 3,   text: '> LEVEL 0 SURVEY UNIT' },
  { at: 6,   text: '' },
  { at: 9,   text: 'BIOS .................... OK' },
  { at: 16,  text: 'MEMORY .................. OK' },
  { at: 23,  text: 'SENSOR ARRAY ............ OK' },
  { at: 30,  text: 'CAMERA FEED ............. OK' },
  { at: 37,  text: 'REAR SONAR .............. OK' },
  { at: 43,  text: 'LIGHT MODULE ............ OK' },
  { at: 50,  text: 'MOTOR DRIVERS ........... OK' },
  { at: 57,  text: 'GYRO .................... OK' },
  { at: 63,  text: 'POWER CELL .............. 84%' },
  { at: 67,  text: '' },
  { at: 70,  text: 'SCANNING SURROUNDINGS...' },
  { at: 76,  text: 'MULTIPLE WALL ANOMALIES' },
  { at: 80,  text: 'SAFE BEACONS ONLINE' },
  { at: 84,  text: 'BEACON COLORS: VARIABLE' },
  { at: 88,  text: 'MONSTER SIGNATURES: 12' },
  { at: 93,  text: savedGame ? 'AUTOSAVE FOUND // RESUMING' : 'NO SAVE // NEW SURVEY' },
  { at: 98,  text: '> READY.' },
];

let bootPctVal = 0;
let bootLineIdx = 0;
let bootDone = false;

function bootStep(){
  bootPctVal = Math.min(100, bootPctVal + 0.8 + Math.random() * 3.2);
  bootPct.textContent = Math.floor(bootPctVal) + '%';
  bootFill.style.width = bootPctVal + '%';

  while (bootLineIdx < BOOT_LINES.length && BOOT_LINES[bootLineIdx].at <= bootPctVal){
    const line = document.createElement('div');
    line.textContent = BOOT_LINES[bootLineIdx].text || '\u00A0';
    bootLog.appendChild(line);
    bootLineIdx++;
    bootLog.scrollTop = bootLog.scrollHeight;
  }

  if (bootPctVal < 100){
    setTimeout(bootStep, 28 + Math.random() * 55);
  } else {
    bootDone = true;
    bootEnter.classList.add('enabled');
    bootEnter.focus();
  }
}
bootStep();

function enterGame(){
  if (!bootDone || bootEl.classList.contains('hidden')) return;
  bootEl.classList.add('hidden');
  startAudio();
  saveGame();
  clockRunning = true;
  lastNow = performance.now();
}
bootEnter.addEventListener('click', enterGame);
addEventListener('keydown', e => {
  if (bootDone && e.key === 'Enter') enterGame();
});

/* ══════════════════════════════════════════════════════════
   NOCLIP / WIN
   ══════════════════════════════════════════════════════════ */
let noclipT = 0;
let won = savedGame?.won || false;
const winEl = document.getElementById('win');

document.getElementById('again').addEventListener('click', () => {
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  location.reload();
});
document.getElementById('endAgain').addEventListener('click', () => {
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  location.reload();
});

if (won) winEl.classList.add('on');

function triggerWin(){
  if (won) return;
  won = true;
  clockRunning = false;
  winEl.classList.add('on');
  playWinTone();
  saveGame();
}

/* ══════════════════════════════════════════════════════════
   BUTTON INPUT
   ══════════════════════════════════════════════════════════ */
const input = { forward: false, back: false, left: false, right: false };
let lightsOn = savedGame?.lightsOn ?? true;

function bindHold(id, key){
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    input[key] = true;
    startAudio();
  });
  const up = () => { input[key] = false; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
}
bindHold('bF', 'forward');
bindHold('bB', 'back');
bindHold('bL', 'left');
bindHold('bR', 'right');

const bLightEl = document.getElementById('bLight');
bLightEl.textContent = lightsOn ? 'LIGHT' : 'DARK';
frontLight.visible = lightsOn;
backLight.visible = lightsOn;

bLightEl.addEventListener('click', () => {
  lightsOn = !lightsOn;
  frontLight.visible = lightsOn;
  backLight.visible = lightsOn;
  bLightEl.textContent = lightsOn ? 'LIGHT' : 'DARK';
  saveGame();
  startAudio();
});

/* ══════════════════════════════════════════════════════════
   RESTORE SAVED STATE
   ══════════════════════════════════════════════════════════ */
if (savedGame){
  if (savedGame.rover){
    rover.x = savedGame.rover.x;
    rover.z = savedGame.rover.z;
    rover.yaw = savedGame.rover.yaw;
  }
  if (Array.isArray(savedGame.monsters) && savedGame.monsters.length === monsters.length){
    for (let i = 0; i < monsters.length; i++){
      const s = savedGame.monsters[i];
      if (typeof s.x === 'number') monsters[i].x = s.x;
      if (typeof s.z === 'number') monsters[i].z = s.z;
      if (typeof s.yaw === 'number') monsters[i].yaw = s.yaw;
      if (typeof s.wanderTimer === 'number') monsters[i].wanderTimer = s.wanderTimer;
    }
  }
}

/* ══════════════════════════════════════════════════════════
   MAIN LOOP
   ══════════════════════════════════════════════════════════ */
streamChunks();

const clock = new THREE.Clock();
let exposure = 1.1;

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  /* Clock */
  const now = performance.now();
  if (clockRunning && bootDone && !won && !caughtActive){
    clockMs += Math.min(now - lastNow, 100);
  }
  lastNow = now;
  clockEl.textContent = formatTime(clockMs);

  updateCaught(dt);

  if (won || caughtActive){
    updateDust(dt);
    updateGlitch(dt);
    applyViewGlitch();
    /* Keep safe zones pulsing even when caught/won */
    const pulse = performance.now() * 0.002;
    for (const zone of safeZones){
      if (zone.light) zone.light.intensity = 8.0 + Math.sin(pulse + zone.index) * 1.6;
      if (zone.halo) zone.halo.material.opacity = 0.12 + Math.sin(pulse * 0.8 + zone.index) * 0.05;
      if (zone.core) zone.core.scale.setScalar(1 + Math.sin(pulse * 2 + zone.index) * 0.10);
    }
    renderer.render(scene, cam);
    updateSonar(dt);
    drawMap();
    return;
  }

  if (input.left)  rover.yaw += TURN_SPEED * dt;
  if (input.right) rover.yaw -= TURN_SPEED * dt;

  const fX = -Math.sin(rover.yaw);
  const fZ = -Math.cos(rover.yaw);
  let dir = 0;
  if (input.forward) dir += 1;
  if (input.back)    dir -= 1;
  const sp = dir > 0 ? MOVE_SPEED : BACK_SPEED;

  const nx = rover.x + fX * dir * sp * dt;
  const nz = rover.z + fZ * dir * sp * dt;
  if (!collide(nx, rover.z)) rover.x = nx;
  if (!collide(rover.x, nz)) rover.z = nz;

  if (dir !== 0){
    const checkX = rover.x + fX * dir * (ROVER_R + 0.25);
    const checkZ = rover.z + fZ * dir * (ROVER_R + 0.25);
    const gx = Math.floor(checkX / CS);
    const gz = Math.floor(checkZ / CS);
    if (isExitWall(gx, gz)){
      if (noclipT === 0) stats.noclipBumps++;
      noclipT += dt;
      if (noclipT > NOCLIP_TIME) triggerWin();
    } else {
      noclipT = Math.max(0, noclipT - dt * 2);
    }
  } else {
    noclipT = Math.max(0, noclipT - dt * 2);
  }

  /* Camera */
  cam.position.set(rover.x, EYE_Y, rover.z);
  cam.rotation.set(-0.06, rover.yaw, 0, 'YXZ');

  if (Math.random() < dt * 11){
    flickTarget = 5.4 + Math.random() * 1.4;
  }
  if (lightsOn){
    frontLight.intensity += (flickTarget - frontLight.intensity) * Math.min(1, dt * 12);
    backLight.intensity  += (flickTarget * 0.6 - backLight.intensity) * Math.min(1, dt * 12);
  }

  frontLight.position.set(rover.x, EYE_Y, rover.z);
  frontTarget.position.set(rover.x + fX * 8, EYE_Y - 0.2, rover.z + fZ * 8);
  backLight.position.set(rover.x, EYE_Y, rover.z);
  backTarget.position.set(rover.x - fX * 6, EYE_Y - 0.2, rover.z - fZ * 6);

  updateMonsters(dt);
  updateDust(dt);

  const pulse = performance.now() * 0.002;
  for (const zone of safeZones){
    if (zone.light) zone.light.intensity = 8.0 + Math.sin(pulse + zone.index) * 1.6;
    if (zone.halo) zone.halo.material.opacity = 0.12 + Math.sin(pulse * 0.8 + zone.index) * 0.05;
    if (zone.core) zone.core.scale.setScalar(1 + Math.sin(pulse * 2 + zone.index) * 0.10);
  }

  const inZone = inSafeZone(rover.x, rover.z);
  if (inZone && !stats.safeZonesVisited.has(inZone.index)){
    stats.safeZonesVisited.add(inZone.index);
    saveGame();
  }

  if (!caughtActive && !inZone && graceTimer <= 0){
    for (const M of monsters){
      const d = Math.hypot(M.x - rover.x, M.z - rover.z);
      if (d < CAUGHT_DIST){
        triggerCaught();
        playCaughtTone();
        break;
      }
    }
  }

  updateGlitch(dt);
  applyViewGlitch();

  const clipP = Math.min(1, noclipT / NOCLIP_TIME);
  const targetExp = 1.1 + clipP * 0.8 + globalFlash * 1.5;
  exposure += (targetExp - exposure) * Math.min(1, dt * 8);
  renderer.toneMappingExposure = exposure;
  globalFlash = Math.max(0, globalFlash - dt * 3);

  streamChunks();
  renderer.render(scene, cam);
  updateSonar(dt);
  drawMap();
}

tick();
</script>
